version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, go]
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    commit-message:
      prefix: "chore(ci)"
    # anthropics/claude-code-action is pinned by audit, not by version.
    # Upstream v1.0.187 began calling replaceCheckoutCredentials() on the
    # use_commit_signing path, rewriting origin to a token-bearing network
    # URL. Both Claude workflows deliberately point origin at a local bare
    # repo holding an exact PR snapshot, so that rewrite destroys the
    # credential-free and the exact-snapshot guarantees at once. Still
    # present upstream as of v1.0.193, and
    # TestClaudeWorkflowsUseAuditedCredentialFreeAction fails any unaudited
    # pin, so every bump Dependabot proposes is red on arrival (#182).
    # Moving the pin is a manual audit of the action's Git behavior; drop
    # this entry once upstream leaves origin alone again.
    ignore:
      - dependency-name: "anthropics/claude-code-action"
    # Dependabot treats every subpath of an action repo as its own
    # dependency, so a repo used via several subpaths gets one PR each.
    # Merged individually those PRs straddle two versions of the same
    # action — codeql-action/init at 4.37.3 against analyze at 4.37.1
    # fails outright ("Loaded a configuration file for version '4.37.3',
    # but running version '4.37.1'"). Group by source repo so subpaths
    # move together in a single PR.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
      ops-routines-workflows:
        patterns:
          - "layervai/ops-routines-workflows*"
