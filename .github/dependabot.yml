# Schema-checked by .github/workflows/validate-dependabot-config.yml.
# A malformed file stops updates for every ecosystem below it, and GitHub
# reports that only in this repository's Dependabot logs — never as a
# failing check, so the symptom is silence.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, go]
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    commit-message:
      prefix: "chore(ci)"
    # anthropics/claude-code-action is pinned by audit, not by version, and
    # was hand-bumped to v1.0.238. Since upstream v1.0.187 the action calls
    # replaceCheckoutCredentials() on the use_commit_signing path: it
    # rewrites origin from the local bare snapshot repo both Claude workflows
    # prepare to a token-bearing URL of this repository, then fetches the
    # base branch through it. The workflows now tolerate exactly that: the
    # verify script asserts origin's destination and workflow-owned snapshot
    # refs rather than an exact origin URL. Those guards still depend on what
    # the action does to Git config and refs, which a version number does
    # not describe, so TestClaudeWorkflowsUseAuditedAction fails any other
    # pin and every bump Dependabot proposes would be red on arrival (#182).
    #
    # Ignore conditions filter security updates too, so an advisory against
    # this action opens no PR either — watch the Dependabot alert, which is
    # configured separately and still fires. Bump by hand: re-read the
    # action's Git behavior at the new version, re-validate both workflows,
    # then move the pin and the test constant together.
    #
    # TestDependabotIgnoresTheAuditedClaudeAction asserts this entry.
    ignore:
      - dependency-name: "anthropics/claude-code-action"
    # Dependabot treats every subpath of an action repo as its own
    # dependency, so a repo used via several subpaths gets one PR each.
    # Merged individually those PRs straddle two versions of the same
    # action — codeql-action/init at 4.37.3 against analyze at 4.37.1
    # fails outright ("Loaded a configuration file for version '4.37.3',
    # but running version '4.37.1'"). Group by source repo so subpaths
    # move together in a single PR.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
      ops-routines-workflows:
        patterns:
          - "layervai/ops-routines-workflows*"
