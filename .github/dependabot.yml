# Schema-checked by .github/workflows/validate-dependabot-config.yml.
# A malformed file stops updates for every ecosystem below it, and GitHub
# reports that only in this repository's Dependabot logs — never as a
# failing check, so the symptom is silence.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, go]
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    commit-message:
      prefix: "chore(ci)"
    # anthropics/claude-code-action is pinned by audit, not by version.
    # Upstream v1.0.187 began calling replaceCheckoutCredentials() on the
    # use_commit_signing path, rewriting origin to a token-bearing network
    # URL; both Claude workflows deliberately point origin at a local bare
    # repo holding an exact PR snapshot, so that rewrite destroys the
    # credential-free and the exact-snapshot guarantees at once. It is still
    # present upstream at v1.0.193, and
    # TestClaudeWorkflowsUseAuditedCredentialFreeAction fails any unaudited
    # pin, so every bump Dependabot proposes is red on arrival (#182).
    #
    # Ignore conditions filter security updates too, so an advisory against
    # this action opens no PR either — watch the Dependabot alert, which is
    # configured separately and still fires. Moving the pin means auditing
    # the action's Git behavior by hand in any case; drop this entry once
    # upstream leaves origin alone again.
    #
    # TestDependabotIgnoresTheAuditedClaudeAction asserts this entry.
    ignore:
      - dependency-name: "anthropics/claude-code-action"
    # Dependabot treats every subpath of an action repo as its own
    # dependency, so a repo used via several subpaths gets one PR each.
    # Merged individually those PRs straddle two versions of the same
    # action — codeql-action/init at 4.37.3 against analyze at 4.37.1
    # fails outright ("Loaded a configuration file for version '4.37.3',
    # but running version '4.37.1'"). Group by source repo so subpaths
    # move together in a single PR.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
      ops-routines-workflows:
        patterns:
          - "layervai/ops-routines-workflows*"
