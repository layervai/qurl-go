name: Native UDP sandbox proof
run-name: UDP proof [corr:${{ inputs.dispatch_correlation_id }}]

on:
  workflow_dispatch:
    inputs:
      dispatch_correlation_id:
        description: Unique NHP-controller correlation id for exact run resolution
        required: true
        type: string
      proof_phase:
        description: Exact retirement-gate phase being proven
        required: true
        type: choice
        options:
          - pre_removal
          - post_removal
      deployment_manifest_b64:
        description: Base64 of the exact non-secret cross-repository sandbox deployment manifest
        required: true
        type: string
      deployment_runtime_inputs_b64:
        description: Base64 of the exact public runtime sidecar authenticated by the NHP controller
        required: true
        type: string
      retirement_probe_targets_b64:
        description: Base64 of the exact canonical runtime-probe targets authenticated by the NHP controller
        required: true
        type: string
      deployment_producer_run_id:
        description: Authenticated NHP deployment-manifest producer run id
        required: true
        type: string
      deployment_producer_run_attempt:
        description: Authenticated NHP deployment-manifest producer run attempt
        required: true
        type: string
      deployment_producer_head_sha:
        description: Authenticated trusted-main NHP producer commit
        required: true
        type: string
      deployment_artifact_id:
        description: Immutable GitHub artifact id selected by the NHP controller
        required: true
        type: string
      deployment_artifact_digest:
        description: SHA-256 digest of the selected NHP producer artifact
        required: true
        type: string
      nhp_controller_run_id:
        description: NHP attended controller workflow run id that created this proof runner
        required: true
        type: string
      nhp_controller_run_attempt:
        description: NHP attended controller workflow run attempt that created this proof runner
        required: true
        type: string
      assignment_handshake_b64:
        description: Controller-armed, run-bound assignment mutation handshake
        required: true
        type: string
      pre_removal_run_id:
        description: Required for post_removal; successful paired pre_removal workflow run id
        required: false
        type: string
      # Optional so the NHP controller's existing dispatch payload keeps working
      # unchanged: empty selects the main-containment candidate shape, which is
      # what a controller dispatching at a merged commit needs. Supply a number
      # only to prove a not-yet-merged head, and it must be an open
      # same-repository pull request targeting main whose head is this exact
      # GITHUB_SHA. Never hardcode a number here — a merged pull request makes
      # the whole proof undispatchable.
      candidate_pull_request_number:
        description: Optional open qurl-go pull request number whose current head is the tested SHA; empty proves containment in main instead
        required: false
        default: ""
        type: string

concurrency:
  group: native-udp-sandbox-proof
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  prove:
    name: direct UDP lifecycle
    runs-on:
      group: udp-proof-sandbox
      labels: run-${{ inputs.nhp_controller_run_id }}-attempt-${{ inputs.nhp_controller_run_attempt }}
    timeout-minutes: 75
    environment: sandbox
    env:
      QURL_GO_SANDBOX_STRICT: "true"
      QURL_GO_SANDBOX_EXPECTED_SHA: ${{ github.sha }}
      QURL_GO_SANDBOX_AGENT_ID: qurl-go-sandbox-${{ inputs.nhp_controller_run_id }}-${{ inputs.nhp_controller_run_attempt }}
      QURL_GO_SANDBOX_KNOCK_RESOURCE_ID: ${{ vars.QURL_GO_SANDBOX_KNOCK_RESOURCE_ID }}
      QURL_GO_SANDBOX_EXPECTED_CELL_ID: ${{ vars.QURL_GO_SANDBOX_EXPECTED_CELL_ID }}
      QURL_GO_SANDBOX_KMS_KEY_ID: alias/layerv-nhp-sandbox-udp-proof-agent-seal
      QURL_GO_SANDBOX_DISPATCH_CORRELATION_ID: ${{ inputs.dispatch_correlation_id }}
      QURL_GO_SANDBOX_NHP_CONTROLLER_RUN_ID: ${{ inputs.nhp_controller_run_id }}
      QURL_GO_SANDBOX_NHP_CONTROLLER_RUN_ATTEMPT: ${{ inputs.nhp_controller_run_attempt }}
      QURL_GO_SANDBOX_PROOF_PHASE: ${{ inputs.proof_phase }}
      QURL_GO_SANDBOX_DEPLOYMENT_MANIFEST_B64: ${{ inputs.deployment_manifest_b64 }}
      QURL_GO_SANDBOX_DEPLOYMENT_RUNTIME_INPUTS_B64: ${{ inputs.deployment_runtime_inputs_b64 }}
      QURL_GO_SANDBOX_RETIREMENT_PROBE_TARGETS_B64: ${{ inputs.retirement_probe_targets_b64 }}
      QURL_GO_SANDBOX_DEPLOYMENT_PRODUCER_RUN_ID: ${{ inputs.deployment_producer_run_id }}
      QURL_GO_SANDBOX_DEPLOYMENT_PRODUCER_RUN_ATTEMPT: ${{ inputs.deployment_producer_run_attempt }}
      QURL_GO_SANDBOX_DEPLOYMENT_PRODUCER_HEAD_SHA: ${{ inputs.deployment_producer_head_sha }}
      QURL_GO_SANDBOX_DEPLOYMENT_ARTIFACT_ID: ${{ inputs.deployment_artifact_id }}
      QURL_GO_SANDBOX_DEPLOYMENT_ARTIFACT_DIGEST: ${{ inputs.deployment_artifact_digest }}
      QURL_GO_SANDBOX_PRE_REMOVAL_RUN_ID: ${{ inputs.pre_removal_run_id }}
      QURL_GO_SANDBOX_CANDIDATE_PULL_REQUEST_NUMBER: ${{ inputs.candidate_pull_request_number }}
      QURL_GO_SANDBOX_ASSIGNMENT_HANDSHAKE_B64: ${{ inputs.assignment_handshake_b64 }}
      QURL_GO_SANDBOX_CLIENT_RUN_ID: ${{ github.run_id }}
      QURL_GO_SANDBOX_OTP_MAILBOX_QUEUE_URL: https://sqs.us-east-2.amazonaws.com/767397897469/layerv-nhp-sandbox-udp-proof-otp-mailbox
      QURL_GO_SANDBOX_OTP_MAILBOX_BUCKET: layerv-nhp-sandbox-udp-proof-otp-mailbox
      QURL_GO_SANDBOX_OTP_MAILBOX_RECIPIENT: qurl-go@proof.notify.layerv.xyz
      QURL_GO_SANDBOX_OTP_MAILBOX_REGION: us-east-2
      PROOF_ACCOUNT_RUN_SECRET: layerv-nhp-sandbox/udp-proof/jit/credential/${{ inputs.nhp_controller_run_id }}/${{ inputs.nhp_controller_run_attempt }}
      QURL_GO_SANDBOX_RECOVERY_REQUEST_SECRET: layerv-nhp-sandbox/udp-proof/recovery/request/${{ inputs.nhp_controller_run_id }}/${{ inputs.nhp_controller_run_attempt }}
      QURL_GO_SANDBOX_RECOVERY_RESPONSE_SECRET: layerv-nhp-sandbox/udp-proof/recovery/response/${{ inputs.nhp_controller_run_id }}/${{ inputs.nhp_controller_run_attempt }}
      QURL_GO_SANDBOX_RECOVERY_KMS_KEY_ARN: arn:aws:kms:us-east-2:767397897469:key/2dc8590c-cf7e-4427-bf48-ea442a3f79d6
      AWS_REGION: us-east-2
    steps:
      - name: Checkout exact build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This repo is PUBLIC, so it cannot read the OPS_ROUTINES org secrets --
      # they are visibility=private, which on GitHub means private repos only.
      # create-github-app-token therefore received an empty app-id and failed
      # on every run this workflow has ever had; the token was never minted
      # once, and the qurl-go leg of the attended proof could not start.
      #
      # The NHP controller is private, already holds the App credentials, and
      # already brokers run-bound material to this job through Secrets Manager
      # (the JIT config and the proof-account credential arrive the same way).
      # It now mints this read-only token with the identical repository and
      # permission set and hands it over on that channel, so only a
      # short-lived installation token crosses into a public repo -- never the
      # App private key -- and no org secret visibility has to change.
      # The ephemeral JIT proof runner is a bare image with NO AWS CLI. Every
      # `aws` call in this job has always died with `aws: command not found`
      # (exit 127) at the FIRST one -- which is why the later
      # `aws secretsmanager` calls further down have never actually executed.
      # They are not evidence that the CLI is present; nothing here has ever
      # reached them.
      #
      # Install it once, before anything needs it. Pinned to v2 and verified,
      # so a silent install failure surfaces here rather than as another 127
      # deep in the proof.
      - name: Ensure the AWS CLI is present on the JIT runner
        shell: bash
        run: |
          set -euo pipefail
          if command -v aws >/dev/null 2>&1; then
            echo "aws already present: $(aws --version 2>&1)"
            exit 0
          fi
          tmp="$(mktemp -d)"
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-$(uname -m).zip" \
            -o "$tmp/awscliv2.zip"
          unzip -q "$tmp/awscliv2.zip" -d "$tmp"
          # --install-dir/--bin-dir under $HOME: the runner user may not have
          # write access to /usr/local.
          "$tmp/aws/install" --install-dir "$HOME/.aws-cli" --bin-dir "$HOME/.local/bin" >/dev/null
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/aws" --version
          rm -rf "$tmp"

      - name: Read the brokered read-only proof-attestation token
        id: proof-token
        env:
          ATTESTATION_TOKEN_SECRET: layerv-nhp-sandbox/udp-proof/jit/attestation-token/${{ inputs.nhp_controller_run_id }}/${{ inputs.nhp_controller_run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          # This step died with exit 127 -- `aws` not found -- while the same
          # binary is used successfully later in THIS SAME job. Two guesses at
          # why were wrong: it is not the shell (adding `shell: bash` in #146
          # changed nothing) and it is not a job boundary (there is only one
          # job, `prove`). So resolve the binary explicitly rather than guess
          # again, and if it genuinely is not there, say so with the PATH
          # attached so the next run answers the question instead of repeating
          # it.
          aws_bin="$(command -v aws || true)"
          if [[ -z "$aws_bin" ]]; then
            for candidate in /usr/local/bin/aws /usr/bin/aws /snap/bin/aws \
                             /opt/actions-runner/bin/aws "$HOME/.local/bin/aws"; do
              [[ -x "$candidate" ]] && { aws_bin="$candidate"; break; }
            done
          fi
          if [[ -z "$aws_bin" ]]; then
            echo "::error::AWS CLI not found on this runner. PATH=$PATH" >&2
            exit 1
          fi
          token="$(
            "$aws_bin" secretsmanager get-secret-value \
              --secret-id "$ATTESTATION_TOKEN_SECRET" \
              --query SecretString --output text --region "$AWS_REGION"
          )"
          # Fail loudly rather than continuing with an empty token: an empty
          # value is exactly the state that made create-github-app-token fail
          # deep inside a later step instead of here.
          if [[ -z "$token" || "$token" == "None" ]]; then
            echo "::error::the NHP controller did not broker a proof-attestation token" >&2
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Verify exact proof inputs
        env:
          GH_TOKEN: ${{ steps.proof-token.outputs.token }}
          QURL_GO_SANDBOX_DISPATCH_CORRELATION_ID: ${{ inputs.dispatch_correlation_id }}
          QURL_GO_SANDBOX_NHP_CONTROLLER_RUN_ID: ${{ inputs.nhp_controller_run_id }}
          QURL_GO_SANDBOX_NHP_CONTROLLER_RUN_ATTEMPT: ${{ inputs.nhp_controller_run_attempt }}
        shell: bash
        run: |
          set -Eeuo pipefail
          # Report WHICH line failed. This step has died with a bare
          # "Process completed with exit code 1" and no annotation at all --
          # not even a command echo -- which costs a full ~35-minute proof
          # cycle per guess. qurl-connector's equivalent step already carries
          # this trap; qurl-go's did not.
          #
          # -E so the trap survives into functions, which is where the failure
          # almost certainly is: the script opens with function definitions and
          # produced no output before dying.
          trap 'status=$?; echo "::error::verify-inputs failed at line ${LINENO} (exit ${status})" >&2' ERR

          compute_proof_harness_sha256() {
            local proof_file
            local -a proof_files
            mapfile -d '' -t proof_files < <(
              {
                printf '%s\0' \
                  .github/workflows/native-udp-sandbox.yml \
                  internal/workflowcontract/native_udp_sandbox_workflow_test.go \
                  tests/e2e/nativeudp/kms_sealed_adapter_aws_test.go.tmpl
                find tests/e2e/nativeudp -type f \( -name '*.go' -o -name '*.json' -o -name '*.py' \) -print0
              } | sort -z -u
            )
            {
              printf 'qurl-go-native-udp-proof-harness-v1\n'
              for proof_file in "${proof_files[@]}"; do
                printf '%s  %s\n' "$(sha256sum "${proof_file}" | cut -d' ' -f1)" "${proof_file}"
              done
            } | sha256sum | cut -d' ' -f1
          }

          canonicalize_json() {
            python3 - "$1" "$2" <<'PY'
          import json
          import os
          import sys

          source, destination = sys.argv[1:]

          def reject_duplicate_keys(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate JSON key: {key}")
                  result[key] = value
              return result

          def reject_constant(value):
              raise ValueError(f"non-finite JSON number: {value}")

          def reject_float(value):
              raise ValueError(f"floating-point JSON number is not allowed: {value}")

          with open(source, "r", encoding="utf-8") as handle:
              value = json.load(
                  handle,
                  object_pairs_hook=reject_duplicate_keys,
                  parse_constant=reject_constant,
                  parse_float=reject_float,
              )

          encoded = json.dumps(
              value,
              allow_nan=False,
              ensure_ascii=True,
              separators=(",", ":"),
              sort_keys=True,
          ).encode("ascii")
          descriptor = os.open(destination, os.O_CREAT | os.O_EXCL | os.O_WRONLY, 0o600)
          with os.fdopen(descriptor, "wb") as handle:
              handle.write(encoded)
          PY
          }

          decode_canonical_base64() {
            python3 - "$1" "$2" "$3" <<'PY'
          import base64
          import binascii
          import os
          import sys

          variable, destination, maximum = sys.argv[1], sys.argv[2], int(sys.argv[3])
          encoded = os.environ.get(variable, "")
          try:
              encoded_bytes = encoded.encode("ascii")
              raw = base64.b64decode(encoded_bytes, validate=True)
          except (UnicodeEncodeError, binascii.Error) as exc:
              raise SystemExit(f"{variable} is not strict standard base64: {exc}")
          if base64.b64encode(raw) != encoded_bytes:
              raise SystemExit(f"{variable} is not canonical standard base64")
          if not 1 <= len(raw) <= maximum:
              raise SystemExit(f"{variable} decoded size is outside 1..{maximum}")
          descriptor = os.open(destination, os.O_CREAT | os.O_EXCL | os.O_WRONLY, 0o600)
          with os.fdopen(descriptor, "wb") as handle:
              handle.write(raw)
          PY
          }

          extract_exact_qurl_go_artifact() {
            python3 - "$1" "$2" <<'PY'
          import os
          import stat
          import sys
          import zipfile

          archive, destination = sys.argv[1:]
          expected = {
              "native-udp-sandbox.evidence.json",
              "deployment-runtime-inputs.json",
              "pre_retirement_scenarios.json",
              "retired_lifecycle_surface.json",
              "sandbox-deployment-manifest.json",
              "typed_evidence_contract.json",
          }
          found = {}
          total_size = 0
          with zipfile.ZipFile(archive) as bundle:
              for entry in bundle.infolist():
                  if entry.is_dir():
                      continue
                  mode = entry.external_attr >> 16
                  if stat.S_ISLNK(mode):
                      raise ValueError(f"artifact contains symlink: {entry.filename}")
                  normalized = entry.filename.replace("\\", "/")
                  components = normalized.split("/")
                  if len(components) != 1 or normalized.startswith("/") or any(part in ("", ".", "..") for part in components):
                      raise ValueError(f"artifact contains unsafe path: {entry.filename}")
                  name = components[-1]
                  if name not in expected or name in found:
                      raise ValueError(f"artifact contains unexpected or duplicate file: {entry.filename}")
                  if entry.file_size <= 0 or entry.file_size > 1024 * 1024:
                      raise ValueError(f"artifact entry size is invalid: {entry.filename}")
                  total_size += entry.file_size
                  if total_size > 2 * 1024 * 1024:
                      raise ValueError("artifact uncompressed size exceeds proof bound")
                  found[name] = entry
              if set(found) != expected:
                  raise ValueError(f"artifact file set mismatch: {sorted(found)}")
              for name, entry in found.items():
                  target = os.path.join(destination, name)
                  descriptor = os.open(target, os.O_CREAT | os.O_EXCL | os.O_WRONLY, 0o600)
                  with os.fdopen(descriptor, "wb") as output, bundle.open(entry) as source:
                      written = 0
                      while block := source.read(1024 * 1024):
                          written += len(block)
                          if written > entry.file_size or written > 1024 * 1024:
                              raise ValueError(f"artifact entry expanded beyond declared size: {entry.filename}")
                          output.write(block)
                      if written != entry.file_size:
                          raise ValueError(f"artifact entry size mismatch: {entry.filename}")
          PY
          }

          validate_manifest() {
            local manifest="$1"
            local phase="$2"
            local retirement_state="$3"
            local qurl_go_sha="$4"
            # The deployed artifact must be built from a commit ON the
            # history of this run -- an ancestor, not necessarily the same commit.
            # Anything else means proving against a tree the deployment never
            # came from, which is still refused.
            local manifest_qurl_go_sha compare_status
            manifest_qurl_go_sha="$(jq -r '.repositories.qurl_go' "${manifest}")"
            if [[ "${manifest_qurl_go_sha}" != "${qurl_go_sha}" ]]; then
              compare_status="$(
                gh api "repos/${GITHUB_REPOSITORY}/compare/${manifest_qurl_go_sha}...${qurl_go_sha}" \
                  --jq '.status'
              )"
              if [[ "${compare_status}" != "ahead" ]]; then
                echo "::error::deployed qurl-go artifact was built from ${manifest_qurl_go_sha}, which is not an ancestor of ${qurl_go_sha} (${compare_status})" >&2
                return 1
              fi
            fi
            jq -e \
              --arg phase "${phase}" \
              --arg retirement_state "${retirement_state}" \
              --arg qurl_go_sha "${qurl_go_sha}" '
              def valid_host:
                length <= 253 and
                test("^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)*\\.nhp\\.layerv\\.(ai|xyz)$");
              def valid_cell_id:
                test("^[a-z](?:[a-z0-9-]{0,61}[a-z0-9])?$");
              . as $root |
              type == "object" and
              (keys | sort) == ["cells", "connector_modules", "hub", "images", "phase", "repositories", "retirement_state", "schema_version"] and
              .schema_version == 1 and .phase == $phase and .retirement_state == $retirement_state and
              (.repositories | type == "object" and
                (keys | sort) == ["frp", "nhp", "qurl_connector", "qurl_go", "qurl_integrations", "qurl_mcp", "qurl_python", "qurl_reverse_tunnel_server", "qurl_service", "qurl_typescript", "website"] and
                all(.[]; type == "string" and test("^[0-9a-f]{40}$")) and
                # NOT `== $qurl_go_sha`. The manifest records the qurl-go
                # commit the DEPLOYED artifact was built from, while
                # $qurl_go_sha is GITHUB_SHA, the tip of main at dispatch. They
                # diverge the moment anything merges in between. Ancestry is
                # asserted in shell below, where an API call is possible.
                # Same defect and same fix as qurl-connector#565.
                true) and
              (.connector_modules | type == "object" and
                (keys | sort) == ["frp", "qurl_go"] and
                all(.[]; type == "string" and test("^[0-9a-f]{40}$")) and
                .frp == $root.repositories.frp and
                .qurl_go == $root.repositories.qurl_go) and
              (.images | type == "object" and
                (keys | sort) == ["nhp_cell0", "nhp_cell1", "nhp_hub", "qurl_connector", "qurl_reverse_tunnel_server", "qurl_service_authority", "qurl_service_cell0", "qurl_service_cell1"] and
                all(.[]; type == "string" and test("^sha256:[0-9a-f]{64}$"))) and
              (.hub | type == "object" and
                (keys | sort) == ["host", "port", "server_public_key_sha256"] and
                (.host | valid_host) and .port == 443 and
                (.server_public_key_sha256 | test("^[0-9a-f]{64}$"))) and
              (.cells | type == "array" and length == 2 and
                [.[].cell_id] == ["cell0", "cell1"] and
                ([.[].cell_id] | unique | length) == length and
                ([.[].host] | unique | length) == length and
                ([.[].server_public_key_sha256] | unique | length) == length and
                ([.[].host] | index($root.hub.host) | not) and
                ([.[].server_public_key_sha256] | index($root.hub.server_public_key_sha256) | not) and
                all(.[];
                  type == "object" and
                  (keys | sort) == ["cell_id", "host", "port", "server_public_key_sha256"] and
                  (.cell_id | valid_cell_id) and (.host | valid_host) and .port == 443 and
                  (.server_public_key_sha256 | test("^[0-9a-f]{64}$"))))
            ' "${manifest}" >/dev/null
          }

          validate_runtime_inputs() {
            local runtime="$1"
            local manifest="$2"
            jq -e --slurpfile manifest "${manifest}" '
              def valid_host:
                length <= 253 and
                test("^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)*\\.nhp\\.layerv\\.(ai|xyz)$");
              def valid_key:
                test("^[A-Za-z0-9+/]{42}[AEIMQUYcgkosw048]=$");
              . as $runtime | $manifest[0] as $deployed |
              type == "object" and
              (keys | sort) == ["cells", "connector_sealed_state", "hub", "schema_version"] and
              .schema_version == 1 and
              (.connector_sealed_state | type == "object" and
                (keys | sort) == ["key_arn", "provider", "region"] and
                .provider == "aws-kms" and .region == "us-east-2" and
                (.key_arn | test("^arn:aws:kms:us-east-2:[0-9]{12}:key/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"))) and
              (.hub | type == "object" and
                (keys | sort) == ["host", "port", "server_public_key_b64"] and
                (.host | valid_host) and .port == 443 and
                (.server_public_key_b64 | valid_key) and
                .host == $deployed.hub.host and .port == $deployed.hub.port) and
              (.cells | type == "array" and length == 2 and
                [.[].cell_id] == ["cell0", "cell1"] and
                all(.[];
                  type == "object" and
                  (keys | sort) == ["cell_id", "host", "port", "server_public_key_b64"] and
                  (.host | valid_host) and .port == 443 and
                  (.server_public_key_b64 | valid_key)) and
                all(.[];
                  . as $runtime_cell |
                  any($deployed.cells[];
                    .cell_id == $runtime_cell.cell_id and
                    .host == $runtime_cell.host and
                    .port == $runtime_cell.port)))
            ' "${runtime}" >/dev/null

            while IFS=$'\t' read -r kind identifier key_b64 expected_sha256; do
              local key_file="${RUNNER_TEMP}/runtime-${kind}-${identifier}.public-key"
              printf '%s' "${key_b64}" | base64 --decode > "${key_file}"
              test "$(wc -c < "${key_file}")" -eq 32
              test "$(sha256sum "${key_file}" | cut -d' ' -f1)" = "${expected_sha256}"
              rm -f "${key_file}"
            done < <(
              jq -r --slurpfile manifest "${manifest}" '
                ["hub", "hub", .hub.server_public_key_b64, $manifest[0].hub.server_public_key_sha256],
                (.cells[] as $cell |
                  ["cell", $cell.cell_id, $cell.server_public_key_b64,
                   ($manifest[0].cells[] | select(.cell_id == $cell.cell_id) | .server_public_key_sha256)])
                | @tsv
              ' "${runtime}"
            )
          }

          verify_repository_commits() {
            local manifest="$1"
            local manifest_key repository expected_sha actual_sha
            while IFS=$'\t' read -r manifest_key repository; do
              expected_sha="$(jq -r --arg key "${manifest_key}" '.repositories[$key]' "${manifest}")"
              # Name the repository on failure. A bare `gh: Not Found (HTTP 404)`
              # here says nothing about WHICH of the ten repositories the token
              # cannot read, and every guess costs a full proof cycle. Each of
              # these commits resolves fine with an ordinary org token, so a 404
              # means the brokered app installation does not cover that repo --
              # the surviving consequence of dropping the explicit repository
              # list in nhp#3734.
              if ! actual_sha="$(gh api "repos/layervai/${repository}/commits/${expected_sha}" --jq '.sha' 2>/dev/null)"; then
                echo "::error::cannot read layervai/${repository}@${expected_sha} with the brokered token; the app installation likely does not cover ${repository}" >&2
                return 1
              fi
              if [[ "${actual_sha}" != "${expected_sha}" ]]; then
                echo "::error::layervai/${repository} resolved ${actual_sha}, expected ${expected_sha}" >&2
                return 1
              fi
            done <<'REPOSITORIES'
          frp	frp
          nhp	nhp
          qurl_go	qurl-go
          qurl_integrations	qurl-integrations
          qurl_mcp	qurl-mcp
          qurl_python	qurl-python
          qurl_reverse_tunnel_server	qurl-reverse-tunnel-server
          qurl_service	qurl-service
          qurl_typescript	qurl-typescript
          website	website
          REPOSITORIES
            expected_sha="$(jq -r '.connector_modules.qurl_go' "${manifest}")"
            actual_sha="$(gh api "repos/layervai/qurl-go/commits/${expected_sha}" --jq '.sha')"
            test "${actual_sha}" = "${expected_sha}"
          }

          test "$(git rev-parse HEAD)" = "${QURL_GO_SANDBOX_EXPECTED_SHA}"
          test -z "$(git status --short)"
          if [[ ! "${QURL_GO_SANDBOX_NHP_CONTROLLER_RUN_ID}" =~ ^[1-9][0-9]{0,19}$ ]] ||
            [[ ! "${QURL_GO_SANDBOX_NHP_CONTROLLER_RUN_ATTEMPT}" =~ ^[1-9][0-9]{0,9}$ ]]; then
            echo "::error::invalid NHP controller run identity"
            exit 1
          fi
          case "${QURL_GO_SANDBOX_PROOF_PHASE}" in
            pre_removal|post_removal) ;;
            *) echo "::error::invalid proof phase"; exit 1 ;;
          esac
          correlation_pattern="^nhp-${QURL_GO_SANDBOX_NHP_CONTROLLER_RUN_ID}-${QURL_GO_SANDBOX_NHP_CONTROLLER_RUN_ATTEMPT}-qurl_go-${QURL_GO_SANDBOX_PROOF_PHASE}-[0-9a-f]{32}$"
          if [[ ! "${QURL_GO_SANDBOX_DISPATCH_CORRELATION_ID}" =~ ${correlation_pattern} ]]; then
            echo "::error::invalid dispatch correlation id"
            exit 1
          fi
          if [[ ! "${QURL_GO_SANDBOX_DEPLOYMENT_PRODUCER_RUN_ID}" =~ ^[1-9][0-9]{0,19}$ ]] ||
            [[ ! "${QURL_GO_SANDBOX_DEPLOYMENT_PRODUCER_RUN_ATTEMPT}" =~ ^[1-9][0-9]{0,9}$ ]] ||
            [[ ! "${QURL_GO_SANDBOX_DEPLOYMENT_PRODUCER_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]] ||
            [[ ! "${QURL_GO_SANDBOX_DEPLOYMENT_ARTIFACT_ID}" =~ ^[1-9][0-9]{0,19}$ ]] ||
            [[ ! "${QURL_GO_SANDBOX_DEPLOYMENT_ARTIFACT_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::invalid deployment producer provenance"
            exit 1
          fi
          # post_removal may run PAIRED or UNPAIRED. The NHP controller already
          # admits the unpaired form, so requiring a lineage here made this
          # client reject exactly the dispatch the controller is allowed to
          # send. Identical to the connector-side fix in qurl-connector#559.
          #
          # A lineage that IS supplied must still be well-formed: absence is
          # admitted, garbage is not.
          if [[ "${QURL_GO_SANDBOX_PROOF_PHASE}" == "pre_removal" ]]; then
            test -z "${QURL_GO_SANDBOX_PRE_REMOVAL_RUN_ID}"
          elif [[ -n "${QURL_GO_SANDBOX_PRE_REMOVAL_RUN_ID}" ]]; then
            [[ "${QURL_GO_SANDBOX_PRE_REMOVAL_RUN_ID}" =~ ^[1-9][0-9]{0,19}$ ]] || {
              echo "::error::invalid pre-removal qurl-go proof lineage"
              exit 1
            }
          fi

          producer_run="${RUNNER_TEMP}/deployment-producer-run.json"
          producer_artifact="${RUNNER_TEMP}/deployment-producer-artifact.json"
          gh api \
            "repos/layervai/nhp/actions/runs/${QURL_GO_SANDBOX_DEPLOYMENT_PRODUCER_RUN_ID}" \
            > "${producer_run}"
          jq -e \
            --arg run_id "${QURL_GO_SANDBOX_DEPLOYMENT_PRODUCER_RUN_ID}" \
            --arg run_attempt "${QURL_GO_SANDBOX_DEPLOYMENT_PRODUCER_RUN_ATTEMPT}" \
            --arg head_sha "${QURL_GO_SANDBOX_DEPLOYMENT_PRODUCER_HEAD_SHA}" '
            (.id | tostring) == $run_id and
            (.run_attempt | tostring) == $run_attempt and
            .path == ".github/workflows/udp-proof-deployment-manifest.yml" and
            .event == "workflow_dispatch" and .status == "completed" and
            .conclusion == "success" and .head_branch == "main" and
            .head_sha == $head_sha and
            .repository.full_name == "layervai/nhp" and
            .head_repository.full_name == "layervai/nhp"
          ' "${producer_run}" >/dev/null
          gh api \
            "repos/layervai/nhp/actions/artifacts/${QURL_GO_SANDBOX_DEPLOYMENT_ARTIFACT_ID}" \
            > "${producer_artifact}"
          jq -e \
            --arg artifact_id "${QURL_GO_SANDBOX_DEPLOYMENT_ARTIFACT_ID}" \
            --arg artifact_name "udp-proof-deployment-manifest-${QURL_GO_SANDBOX_DEPLOYMENT_PRODUCER_RUN_ID}-${QURL_GO_SANDBOX_DEPLOYMENT_PRODUCER_RUN_ATTEMPT}" \
            --arg artifact_digest "${QURL_GO_SANDBOX_DEPLOYMENT_ARTIFACT_DIGEST}" \
            --arg run_id "${QURL_GO_SANDBOX_DEPLOYMENT_PRODUCER_RUN_ID}" \
            --arg head_sha "${QURL_GO_SANDBOX_DEPLOYMENT_PRODUCER_HEAD_SHA}" '
            (.id | tostring) == $artifact_id and .name == $artifact_name and
            .digest == $artifact_digest and .expired == false and
            (.size_in_bytes | type == "number" and . >= 1 and . <= 262144) and
            (.workflow_run.id | tostring) == $run_id and
            .workflow_run.head_branch == "main" and .workflow_run.head_sha == $head_sha
          ' "${producer_artifact}" >/dev/null
          producer_commit="${RUNNER_TEMP}/deployment-producer-commit.json"
          gh api \
            "repos/layervai/nhp/commits/${QURL_GO_SANDBOX_DEPLOYMENT_PRODUCER_HEAD_SHA}" \
            > "${producer_commit}"
          jq -e --arg sha "${QURL_GO_SANDBOX_DEPLOYMENT_PRODUCER_HEAD_SHA}" '
            .sha == $sha and .commit.verification.verified == true
          ' "${producer_commit}" >/dev/null

          manifest_raw="${RUNNER_TEMP}/sandbox-deployment-manifest.input.json"
          manifest_candidate="${RUNNER_TEMP}/sandbox-deployment-manifest.canonical.tmp"
          manifest="${RUNNER_TEMP}/sandbox-deployment-manifest.json"
          runtime_raw="${RUNNER_TEMP}/deployment-runtime-inputs.input.json"
          runtime_candidate="${RUNNER_TEMP}/deployment-runtime-inputs.canonical.tmp"
          runtime="${RUNNER_TEMP}/deployment-runtime-inputs.json"
          retirement_targets_raw="${RUNNER_TEMP}/retirement-probe-targets.input.json"
          retirement_targets_candidate="${RUNNER_TEMP}/retirement-probe-targets.canonical.tmp"
          retirement_targets="${RUNNER_TEMP}/retirement-probe-targets.json"
          inventory="tests/e2e/nativeudp/pre_retirement_scenarios.json"
          inventory_snapshot="${RUNNER_TEMP}/pre_retirement_scenarios.json"
          typed_evidence_contract="tests/e2e/nativeudp/typed_evidence_contract.json"
          typed_evidence_contract_snapshot="${RUNNER_TEMP}/typed_evidence_contract.json"
          retired_surface="tests/e2e/nativeudp/retired_lifecycle_surface.json"
          retired_surface_snapshot="${RUNNER_TEMP}/retired_lifecycle_surface.json"
          trap 'rm -f "${manifest_raw}" "${manifest_candidate}" "${runtime_raw}" "${runtime_candidate}" "${retirement_targets_raw}" "${retirement_targets_candidate}"' EXIT
          decode_canonical_base64 \
            QURL_GO_SANDBOX_DEPLOYMENT_MANIFEST_B64 "${manifest_raw}" 32768
          canonicalize_json "${manifest_raw}" "${manifest_candidate}"
          cmp "${manifest_raw}" "${manifest_candidate}"
          decode_canonical_base64 \
            QURL_GO_SANDBOX_DEPLOYMENT_RUNTIME_INPUTS_B64 "${runtime_raw}" 8192
          canonicalize_json "${runtime_raw}" "${runtime_candidate}"
          cmp "${runtime_raw}" "${runtime_candidate}"
          decode_canonical_base64 \
            QURL_GO_SANDBOX_RETIREMENT_PROBE_TARGETS_B64 "${retirement_targets_raw}" 16384
          canonicalize_json "${retirement_targets_raw}" "${retirement_targets_candidate}"
          cmp "${retirement_targets_raw}" "${retirement_targets_candidate}"

          retirement_state="http_lifecycle_present"
          if [[ "${QURL_GO_SANDBOX_PROOF_PHASE}" == "post_removal" ]]; then
            retirement_state="http_lifecycle_removed"
          fi
          validate_manifest \
            "${manifest_candidate}" \
            "${QURL_GO_SANDBOX_PROOF_PHASE}" \
            "${retirement_state}" \
            "${GITHUB_SHA}"

          validate_runtime_inputs "${runtime_candidate}" "${manifest_candidate}"

          mv "${manifest_candidate}" "${manifest}"
          mv "${runtime_candidate}" "${runtime}"
          mv "${retirement_targets_candidate}" "${retirement_targets}"
          verify_repository_commits "${manifest}"
          # Candidate acceptance. The proof binds to exactly one commit of THIS
          # repository — the GITHUB_SHA this job is running — in one of two
          # shapes and nothing else. Both are resolved through the authenticated
          # API, and every failure path here is fatal: `set -e` plus `jq -e`
          # means an unreachable API, an unexpected payload, or a false
          # predicate stops the run before any credential is minted.
          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::invalid candidate build SHA"
            exit 1
          }
          candidate="${RUNNER_TEMP}/qurl-go-candidate.json"
          candidate_kind="main_contained"
          if [[ -n "${QURL_GO_SANDBOX_CANDIDATE_PULL_REQUEST_NUMBER}" ]]; then
            [[ "${QURL_GO_SANDBOX_CANDIDATE_PULL_REQUEST_NUMBER}" =~ ^[1-9][0-9]{0,9}$ ]] || {
              echo "::error::invalid candidate pull request number"
              exit 1
            }
            candidate_kind="open_pull_request"
          fi
          if [[ "${candidate_kind}" == "open_pull_request" ]]; then
            # Pre-merge shape: the operator named a pull request, so that pull
            # request must still be open in this repository, target main, and
            # have this exact commit as its CURRENT head. A stale or force-pushed
            # head no longer matches GITHUB_SHA and is rejected.
            gh api \
              "repos/${GITHUB_REPOSITORY}/pulls/${QURL_GO_SANDBOX_CANDIDATE_PULL_REQUEST_NUMBER}" \
              > "${candidate}"
            jq -e \
              --arg repository "${GITHUB_REPOSITORY}" \
              --arg sha "${GITHUB_SHA}" \
              --argjson number "${QURL_GO_SANDBOX_CANDIDATE_PULL_REQUEST_NUMBER}" '
              .number == $number and .state == "open" and
              .head.repo.full_name == $repository and .base.repo.full_name == $repository and
              .base.ref == "main" and .head.sha == $sha
            ' "${candidate}" >/dev/null
          else
            # Merged shape: prove CONTAINMENT in main, not mere existence. The
            # commit API answers "this object exists somewhere in the repository
            # network", which a fork tip or an abandoned branch also satisfies.
            # The compare API answers the question that matters: with main as the
            # base, the merge base of main and GITHUB_SHA must be GITHUB_SHA
            # itself and nothing may be ahead of it, which holds only when the
            # commit is main's head or an ancestor of it. `.url` echoes the exact
            # requested repository and base...head pair, so the payload itself
            # binds the repository and the base ref rather than the request alone.
            gh api "repos/${GITHUB_REPOSITORY}/compare/main...${GITHUB_SHA}" > "${candidate}"
            jq -e --arg repository "${GITHUB_REPOSITORY}" --arg sha "${GITHUB_SHA}" '
              .url == "https://api.github.com/repos/" + $repository + "/compare/main..." + $sha and
              (.status == "identical" or .status == "behind") and
              .ahead_by == 0 and .merge_base_commit.sha == $sha and
              (.base_commit.sha | type == "string" and test("^[0-9a-f]{40}$"))
            ' "${candidate}" >/dev/null
          fi
          candidate_commit="${RUNNER_TEMP}/qurl-go-candidate-commit.json"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" > "${candidate_commit}"
          jq -e --arg sha "${GITHUB_SHA}" '
            .sha == $sha and .commit.verification.verified == true
          ' "${candidate_commit}" >/dev/null
          chmod 0444 "${candidate}" "${candidate_commit}"
          canonicalize_json "${inventory}" "${inventory_snapshot}"
          canonicalize_json "${retired_surface}" "${retired_surface_snapshot}"
          cp -- "${typed_evidence_contract}" "${typed_evidence_contract_snapshot}"
          chmod 0444 \
            "${manifest}" "${runtime}" "${retirement_targets}" "${inventory_snapshot}" "${retired_surface_snapshot}" \
            "${typed_evidence_contract_snapshot}"
          deployment_manifest_sha256="$(sha256sum "${manifest}" | cut -d' ' -f1)"
          deployment_runtime_inputs_sha256="$(sha256sum "${runtime}" | cut -d' ' -f1)"
          retirement_probe_targets_sha256="$(sha256sum "${retirement_targets}" | cut -d' ' -f1)"
          inventory_sha256="$(sha256sum "${inventory_snapshot}" | cut -d' ' -f1)"
          inventory_mapping_sha256="$(jq -cS -j '{schema_version, gate, proof_phases, all_scenarios_required, scenarios: ([.scenarios[] | {id, owner, status, test_name, requirement}] | sort_by(.id))}' "${inventory}" | sha256sum | cut -d' ' -f1)"
          test "${inventory_mapping_sha256}" = "869e3a4f6cd6fbbb1fb786b9dc26a2778406dcd814bf226cdddc13f66f4b1e2d"
          scenario_contract_sha256="$(jq -cS '{schema_version, gate, proof_phases, all_scenarios_required, scenarios: ([.scenarios[] | {id, owner, test_name, requirement}] | sort_by(.id))}' "${inventory}" | sha256sum | cut -d' ' -f1)"
          typed_evidence_contract_sha256="$(sha256sum "${typed_evidence_contract_snapshot}" | cut -d' ' -f1)"
          test "${typed_evidence_contract_sha256}" = "f4b37aceb2dd55f2c1cf6d7ec4e955cfeb69297ff6151b565935d03d01f65d08"
          retired_lifecycle_surface_sha256="$(sha256sum "${retired_surface_snapshot}" | cut -d' ' -f1)"
          test "${retired_lifecycle_surface_sha256}" = "3fe8872c3da9913c28d763f5561d82b67805aae5a6962c6dc403c7d6305da00c"
          proof_harness_sha256="$(compute_proof_harness_sha256)"
          {
            echo "QURL_GO_SANDBOX_DEPLOYMENT_MANIFEST_PATH=${manifest}"
            echo "QURL_GO_SANDBOX_DEPLOYMENT_MANIFEST_SHA256=${deployment_manifest_sha256}"
            echo "QURL_GO_SANDBOX_DEPLOYMENT_RUNTIME_INPUTS_PATH=${runtime}"
            echo "QURL_GO_SANDBOX_DEPLOYMENT_RUNTIME_INPUTS_SHA256=${deployment_runtime_inputs_sha256}"
            echo "QURL_GO_SANDBOX_RETIREMENT_PROBE_TARGETS_PATH=${retirement_targets}"
            echo "QURL_GO_SANDBOX_RETIREMENT_PROBE_TARGETS_SHA256=${retirement_probe_targets_sha256}"
            echo "QURL_GO_SANDBOX_NHP_SOURCE_SHA=$(jq -r '.repositories.nhp' "${manifest}")"
            echo "QURL_GO_SANDBOX_QURL_SERVICE_SOURCE_SHA=$(jq -r '.repositories.qurl_service' "${manifest}")"
            echo "QURL_GO_SANDBOX_QURL_SERVICE_AUTHORITY_IMAGE_DIGEST=$(jq -r '.images.qurl_service_authority' "${manifest}")"
            echo "QURL_GO_SANDBOX_HUB_HOST=$(jq -r '.hub.host' "${runtime}")"
            echo "QURL_GO_SANDBOX_HUB_PORT=$(jq -r '.hub.port' "${runtime}")"
            echo "QURL_GO_SANDBOX_HUB_SERVER_PUBLIC_KEY_B64=$(jq -r '.hub.server_public_key_b64' "${runtime}")"
            echo "QURL_GO_SANDBOX_INVENTORY_PATH=${inventory_snapshot}"
            echo "QURL_GO_SANDBOX_INVENTORY_SHA256=${inventory_sha256}"
            echo "QURL_GO_SANDBOX_INVENTORY_MAPPING_SHA256=${inventory_mapping_sha256}"
            echo "QURL_GO_SANDBOX_SCENARIO_CONTRACT_SHA256=${scenario_contract_sha256}"
            echo "QURL_GO_SANDBOX_TYPED_EVIDENCE_CONTRACT_SHA256=${typed_evidence_contract_sha256}"
            echo "QURL_GO_SANDBOX_CANDIDATE_KIND=${candidate_kind}"
            echo "QURL_GO_SANDBOX_CANDIDATE_PATH=${candidate}"
            echo "QURL_GO_SANDBOX_CANDIDATE_COMMIT_PATH=${candidate_commit}"
            echo "QURL_GO_SANDBOX_RETIRED_LIFECYCLE_SURFACE_PATH=${retired_surface_snapshot}"
            echo "QURL_GO_SANDBOX_RETIRED_LIFECYCLE_SURFACE_SHA256=${retired_lifecycle_surface_sha256}"
            echo "QURL_GO_SANDBOX_PROOF_HARNESS_SHA256=${proof_harness_sha256}"
          } >> "${GITHUB_ENV}"

          if [[ "${QURL_GO_SANDBOX_PROOF_PHASE}" == "pre_removal" ]]; then
            test -z "${QURL_GO_SANDBOX_PRE_REMOVAL_RUN_ID}"
            exit 0
          fi

          # Unpaired post_removal: everything below is a PAIRWISE differential
          # against a pre_removal run, so with no lineage there is nothing to
          # diff. End the step here -- `exit 0` ends the STEP, not the job, so
          # the sandbox scenarios still run and still produce their evidence.
          if [[ -z "${QURL_GO_SANDBOX_PRE_REMOVAL_RUN_ID}" ]]; then
            exit 0
          fi

          [[ "${QURL_GO_SANDBOX_PRE_REMOVAL_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          pre_dir="${RUNNER_TEMP}/pre-removal-evidence"
          mkdir -p "${pre_dir}"
          current_workflow_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/native-udp-sandbox.yml" --jq '.id')"
          [[ "${current_workflow_id}" =~ ^[1-9][0-9]*$ ]]
          gh run view "${QURL_GO_SANDBOX_PRE_REMOVAL_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --json attempt,conclusion,event,headSha,workflowDatabaseId > "${pre_dir}/run.json"
          jq -e --argjson workflow_id "${current_workflow_id}" '
            .conclusion == "success" and .event == "workflow_dispatch" and
            .workflowDatabaseId == $workflow_id and (.attempt | type == "number" and . >= 1) and
            (.headSha | type == "string" and test("^[0-9a-f]{40}$"))
          ' "${pre_dir}/run.json" >/dev/null
          pre_head_sha="$(jq -r '.headSha' "${pre_dir}/run.json")"
          pre_attempt="$(jq -r '.attempt' "${pre_dir}/run.json")"
          pre_artifact_name="native-udp-sandbox-pre_removal-${pre_head_sha}-${pre_attempt}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${QURL_GO_SANDBOX_PRE_REMOVAL_RUN_ID}/artifacts?name=${pre_artifact_name}&per_page=100" \
            > "${pre_dir}/artifacts.json"
          jq -e --arg name "${pre_artifact_name}" '
            .total_count == 1 and (.artifacts | length) == 1 and
            .artifacts[0].name == $name and .artifacts[0].expired == false and
            (.artifacts[0].id | type == "number" and . >= 1) and
            (.artifacts[0].size_in_bytes | type == "number" and . >= 1 and . <= 5242880) and
            (.artifacts[0].digest | type == "string" and test("^sha256:[0-9a-f]{64}$"))
          ' "${pre_dir}/artifacts.json" >/dev/null
          pre_artifact_id="$(jq -r '.artifacts[0].id' "${pre_dir}/artifacts.json")"
          pre_artifact_sha256="$(jq -r '.artifacts[0].digest | sub("^sha256:"; "")' "${pre_dir}/artifacts.json")"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${pre_artifact_id}/zip" \
            > "${pre_dir}/artifact.zip"
          test "$(sha256sum "${pre_dir}/artifact.zip" | cut -d' ' -f1)" = "${pre_artifact_sha256}"
          mkdir -m 0700 "${pre_dir}/artifact"
          extract_exact_qurl_go_artifact "${pre_dir}/artifact.zip" "${pre_dir}/artifact"

          pre_evidence="${pre_dir}/artifact/native-udp-sandbox.evidence.json"
          pre_manifest="${pre_dir}/artifact/sandbox-deployment-manifest.json"
          pre_runtime="${pre_dir}/artifact/deployment-runtime-inputs.json"
          pre_inventory="${pre_dir}/artifact/pre_retirement_scenarios.json"
          pre_retired_surface="${pre_dir}/artifact/retired_lifecycle_surface.json"
          pre_typed_evidence_contract="${pre_dir}/artifact/typed_evidence_contract.json"

          python3 - "${pre_evidence}" <<'PY'
          import hashlib
          import json
          import sys

          with open(sys.argv[1], "rb") as handle:
              evidence = json.load(handle)
          for scenario in evidence["typed_evidence"]:
              for item in scenario["evidence"]:
                  canonical = json.dumps(
                      item["observation"],
                      allow_nan=False,
                      ensure_ascii=False,
                      separators=(",", ":"),
                      sort_keys=True,
                  ).encode("utf-8")
                  if hashlib.sha256(canonical).hexdigest() != item["observation_sha256"]:
                      raise SystemExit(
                          f"typed evidence digest mismatch for {scenario['scenario_key']}/{item['kind']}"
                      )
          PY

          pre_manifest_canonical="${pre_dir}/pre-manifest.canonical.json"
          pre_runtime_canonical="${pre_dir}/pre-runtime.canonical.json"
          pre_evidence_canonical="${pre_dir}/pre-evidence.canonical.json"
          pre_inventory_canonical="${pre_dir}/pre-inventory.canonical.json"
          pre_retired_surface_canonical="${pre_dir}/pre-retired-surface.canonical.json"
          canonicalize_json "${pre_manifest}" "${pre_manifest_canonical}"
          canonicalize_json "${pre_runtime}" "${pre_runtime_canonical}"
          canonicalize_json "${pre_evidence}" "${pre_evidence_canonical}"
          canonicalize_json "${pre_inventory}" "${pre_inventory_canonical}"
          canonicalize_json "${pre_retired_surface}" "${pre_retired_surface_canonical}"
          cmp -s "${pre_manifest}" "${pre_manifest_canonical}"
          cmp -s "${pre_runtime}" "${pre_runtime_canonical}"
          cmp -s "${pre_evidence}" "${pre_evidence_canonical}"
          cmp -s "${pre_inventory}" "${pre_inventory_canonical}"
          cmp -s "${pre_retired_surface}" "${pre_retired_surface_canonical}"
          validate_manifest "${pre_manifest}" "pre_removal" "http_lifecycle_present" "${pre_head_sha}"
          validate_runtime_inputs "${pre_runtime}" "${pre_manifest}"
          verify_repository_commits "${pre_manifest}"
          pre_runtime_sha256="$(sha256sum "${pre_runtime}" | cut -d' ' -f1)"

          jq -e \
            --slurpfile deployment "${pre_manifest}" \
            --slurpfile scenarios "${pre_inventory}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg run_id "${QURL_GO_SANDBOX_PRE_REMOVAL_RUN_ID}" \
            --arg run_attempt "${pre_attempt}" \
            --arg commit_sha "${pre_head_sha}" \
            --arg contract "${scenario_contract_sha256}" \
            --arg harness "${proof_harness_sha256}" \
            --arg inventory_sha "${inventory_sha256}" \
            --arg inventory_mapping_sha "${inventory_mapping_sha256}" \
            --arg runtime_sha "${pre_runtime_sha256}" \
            --arg retired_surface_sha "${retired_lifecycle_surface_sha256}" '
            def valid_counter:
              type == "number" and isfinite and . == floor and . >= 1 and . <= 9007199254740991;
            def same_assignment_binding($left; $right):
              $left.cell_id == $right.cell_id and $left.host == $right.host and $left.port == $right.port and
              $left.server_public_key_sha256 == $right.server_public_key_sha256 and
              $left.assignment_generation == $right.assignment_generation and
              $left.endpoint_revision == $right.endpoint_revision and $left.lease_expires_at == $right.lease_expires_at;
            def valid_same_cell_refresh($left; $right):
              def rfc3339_parts:
                capture("^(?<base>[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2})(?:\\.(?<fraction>[0-9]{1,9}))?Z$") as $timestamp |
                ($timestamp.base + "Z") as $whole_seconds |
                ($whole_seconds | fromdateiso8601) as $epoch_seconds |
                select(($epoch_seconds | strftime("%Y-%m-%dT%H:%M:%SZ")) == $whole_seconds) |
                [$epoch_seconds,
                 (((($timestamp.fraction // "") + "000000000")[0:9]) | tonumber)];
              ($left.lease_expires_at | rfc3339_parts) as $left_lease |
              ($right.lease_expires_at | rfc3339_parts) as $right_lease |
              $left.cell_id == $right.cell_id and $left.host == $right.host and $left.port == $right.port and
              $left.server_public_key_sha256 == $right.server_public_key_sha256 and
              $left.assignment_generation == $right.assignment_generation and
              $right.endpoint_revision >= $left.endpoint_revision and
              ($right_lease[0] > $left_lease[0] or
               ($right_lease[0] == $left_lease[0] and $right_lease[1] >= $left_lease[1]));
            . as $evidence | $deployment[0] as $deployed | $scenarios[0] as $inventory |
            type == "object" and
            (keys | sort) == ["commit_sha", "counts", "deployment_manifest_sha256", "deployment_producer", "deployment_runtime_inputs_sha256", "dispatch_correlation_id", "enforcement_outcome", "gate_passed", "inputs_unchanged", "inventory_mapping_sha256", "inventory_sha256", "nhp_controller_run_attempt", "nhp_controller_run_id", "phase", "pre_removal_deployment_sha256", "pre_removal_evidence_sha256", "pre_removal_run_id", "proof_harness_sha256", "provenance", "provenance_valid", "repository", "retired_lifecycle_surface_sha256", "run_attempt", "run_id", "scenario_contract_sha256", "scenario_results", "schema_version", "strict_outcome", "two_cell_provenance", "typed_evidence", "typed_evidence_complete", "typed_evidence_contract_sha256"] and
            .schema_version == 1 and .phase == "pre_removal" and .gate_passed == true and
            .repository == $repository and .run_id == $run_id and .run_attempt == $run_attempt and
            .commit_sha == $commit_sha and .strict_outcome == "success" and .enforcement_outcome == "success" and
            .inputs_unchanged == true and .provenance_valid == true and .two_cell_provenance == true and .typed_evidence_complete == true and
            (.nhp_controller_run_id | type == "string" and test("^[1-9][0-9]{0,19}$")) and
            (.nhp_controller_run_attempt | type == "string" and test("^[1-9][0-9]{0,9}$")) and
            (. as $e | $e.dispatch_correlation_id | type == "string" and
              test("^nhp-" + $e.nhp_controller_run_id + "-" + $e.nhp_controller_run_attempt + "-qurl_go-pre_removal-[0-9a-f]{32}$")) and
            (.deployment_producer |
              (keys | sort) == ["artifact_digest", "artifact_id", "head_sha", "repository", "run_attempt", "run_id", "workflow_path"] and
              .repository == "layervai/nhp" and
              .workflow_path == ".github/workflows/udp-proof-deployment-manifest.yml" and
              (.run_id | test("^[1-9][0-9]{0,19}$")) and
              (.run_attempt | test("^[1-9][0-9]{0,9}$")) and
              (.head_sha | test("^[0-9a-f]{40}$")) and
              (.artifact_id | test("^[1-9][0-9]{0,19}$")) and
              (.artifact_digest | test("^sha256:[0-9a-f]{64}$"))) and
            .deployment_runtime_inputs_sha256 == $runtime_sha and
            .pre_removal_run_id == null and .pre_removal_evidence_sha256 == null and .pre_removal_deployment_sha256 == null and
            ($inventory | type == "object" and
              (keys | sort) == ["all_scenarios_required", "gate", "proof_phases", "scenarios", "schema_version"] and
              .schema_version == 1 and .gate == "udp_lifecycle_retirement" and
              .proof_phases == ["pre_removal", "post_removal"] and .all_scenarios_required == true and
              (.scenarios | type == "array" and length == 68 and
                ([.[].id] | unique | length) == length and ([.[].test_name] | unique | length) == length and
                all(.[];
                  type == "object" and
                  (if .owner == "qurl-go" then .status == "implemented" else .status == "external_dependency" end) and
                  (.test_name | type == "string" and length > 0)))) and
            (.counts | type == "object" and
              (keys | sort) == ["exact_passes", "external_dependency", "failures", "producer_owned", "skips"] and
              .producer_owned == ([$inventory.scenarios[] | select(.owner == "qurl-go" and .status == "implemented")] | length) and
              .external_dependency == ([$inventory.scenarios[] | select(.owner != "qurl-go" and .status == "external_dependency")] | length) and
              .failures == 0 and .skips == 0 and
              .exact_passes == .producer_owned) and
            .scenario_contract_sha256 == $contract and .proof_harness_sha256 == $harness and
            .inventory_sha256 == $inventory_sha and
            .inventory_mapping_sha256 == $inventory_mapping_sha and
            .retired_lifecycle_surface_sha256 == $retired_surface_sha and
            .typed_evidence_contract_sha256 == "f4b37aceb2dd55f2c1cf6d7ec4e955cfeb69297ff6151b565935d03d01f65d08" and
            (.provenance | type == "object" and
              (keys | sort) == ["agent_id", "assigned_cells", "build_sha", "deployment_manifest_sha256", "hub", "schema_version", "typed_evidence_contract_sha256"] and
              .schema_version == 2 and .build_sha == $commit_sha and
              .deployment_manifest_sha256 == $evidence.deployment_manifest_sha256 and
              .typed_evidence_contract_sha256 == $evidence.typed_evidence_contract_sha256 and
              (.deployment_manifest_sha256 | test("^[0-9a-f]{64}$")) and
              (.typed_evidence_contract_sha256 | test("^[0-9a-f]{64}$")) and
              (.agent_id | type == "string" and length > 0) and .hub == $deployed.hub and
              (.assigned_cells | type == "array" and length == 4 and
                [.[].phase] == ["registration", "warm_open", "reassignment", "refresh"] and
                ([.[].cell_id] | unique | length) >= 2 and
                ([.[].host] | unique | length) >= 2 and
                ([.[].server_public_key_sha256] | unique | length) >= 2 and
                same_assignment_binding(.[0]; .[1]) and
                .[1].cell_id == "cell0" and .[2].cell_id == "cell1" and
                .[2].assignment_generation > .[1].assignment_generation and
                valid_same_cell_refresh(.[2]; .[3]) and
                all(.[];
                  type == "object" and
                  (keys | sort) == ["assignment_generation", "cell_id", "endpoint_revision", "host", "lease_expires_at", "phase", "port", "server_public_key_sha256"] and
                  (.phase | type == "string" and test("^[a-z](?:[a-z0-9_]{0,62}[a-z0-9])?$")) and
                  (.assignment_generation | valid_counter) and (.endpoint_revision | valid_counter) and
                  (.lease_expires_at | type == "string" and length >= 20 and length <= 30 and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\\.[0-9]{1,9})?Z$")) and
                  (. as $observed | any($deployed.cells[];
                    .cell_id == $observed.cell_id and .host == $observed.host and .port == $observed.port and
                    .server_public_key_sha256 == $observed.server_public_key_sha256))))) and
            (.typed_evidence | type == "array" and length == ($inventory.scenarios | length) and
              ([.[].scenario_key] | sort) == ($inventory.scenarios | map(.id) | sort) and
              ([.[].scenario_key] | unique | length) == length and
              all(.[];
                type == "object" and (keys | sort) == ["evidence", "scenario_key"] and
                (.scenario_key | type == "string") and
                (. as $typed |
                  ($inventory.scenarios[] | select(.id == $typed.scenario_key)) as $scenario |
                  (.evidence | type == "array") and
                  (if $scenario.owner == "qurl-go" or
                      ($scenario.id == "orchestrator.real_hub_authority_and_two_cells" or
                       $scenario.id == "retirement.generated_artifact_parity" or
                       $scenario.id == "retirement.nhp_registrar_surface_state" or
                       $scenario.id == "retirement.terraform_saved_plan_and_live_state") then
                    (.evidence | length >= 1)
                  else
                    (.evidence | length == 0)
                  end) and
                  ([.evidence[].kind] | unique | length) == (.evidence | length) and
                  all(.evidence[];
                    type == "object" and (keys | sort) == ["kind", "observation", "observation_sha256"] and
                    (.kind | type == "string" and test("^[a-z][a-z0-9_]{0,63}$")) and
                    (. as $item |
                      if $scenario.owner == "qurl-go" then
                        $item.observation == {
                          evidence_kind: $item.kind,
                          outcome: "pass",
                          producer: "layervai/qurl-go",
                          scenario_key: $typed.scenario_key,
                          test_name: $scenario.test_name,
                          verified: true
                        }
                      else
                        ($item.observation | type == "object" and
                          (keys | sort) == ["evidence_kind", "producer", "producer_run_id", "row_sha256", "scenario_key", "source_sha", "verified"] and
                          .evidence_kind == $item.kind and
                          .producer == "layervai/nhp" and
                          .scenario_key == $typed.scenario_key and
                          .verified == true and
                          (.producer_run_id | type == "number" and isfinite and . == floor and . >= 1) and
                          (.producer_run_id | tostring) == $evidence.deployment_producer.run_id and
                          (.row_sha256 | type == "string" and test("^[0-9a-f]{64}$")) and
                          .source_sha == $deployed.repositories.nhp)
                      end) and
                    (.observation_sha256 | type == "string" and test("^[0-9a-f]{64}$")))))) and
            (.scenario_results | type == "array" and
              length == ([$inventory.scenarios[] | select(.owner == "qurl-go" and .status == "implemented")] | length) and
              ([.[].test_name] | unique | length) == length and
              all(.[];
                type == "object" and (keys | sort) == ["action", "elapsed_seconds", "test_name"] and
                .action == "pass" and (.test_name | type == "string" and length > 0) and
                (. as $result | any($inventory.scenarios[];
                  .owner == "qurl-go" and .status == "implemented" and .test_name == $result.test_name)) and
                (.elapsed_seconds == null or (.elapsed_seconds | type == "number" and isfinite and . >= 0))) and
              all($inventory.scenarios[] | select(.owner == "qurl-go" and .status == "implemented");
                . as $scenario |
                ([$evidence.scenario_results[] | select(.test_name == $scenario.test_name and .action == "pass")] | length) == 1))
          ' "${pre_evidence}" >/dev/null

          pre_deployment_sha256="$(sha256sum "${pre_manifest}" | cut -d' ' -f1)"
          pre_inventory_sha256="$(sha256sum "${pre_inventory}" | cut -d' ' -f1)"
          pre_inventory_mapping_sha256="$(jq -cS -j '{schema_version, gate, proof_phases, all_scenarios_required, scenarios: ([.scenarios[] | {id, owner, status, test_name, requirement}] | sort_by(.id))}' "${pre_inventory}" | sha256sum | cut -d' ' -f1)"
          pre_retired_lifecycle_surface_sha256="$(sha256sum "${pre_retired_surface}" | cut -d' ' -f1)"
          pre_typed_evidence_contract_sha256="$(sha256sum "${pre_typed_evidence_contract}" | cut -d' ' -f1)"
          test "$(jq -r '.deployment_manifest_sha256' "${pre_evidence}")" = "${pre_deployment_sha256}"
          test "$(jq -r '.inventory_sha256' "${pre_evidence}")" = "${pre_inventory_sha256}"
          test "${pre_inventory_sha256}" = "${inventory_sha256}"
          test "${pre_inventory_mapping_sha256}" = "${inventory_mapping_sha256}"
          test "${pre_inventory_mapping_sha256}" = "869e3a4f6cd6fbbb1fb786b9dc26a2778406dcd814bf226cdddc13f66f4b1e2d"
          test "${pre_retired_lifecycle_surface_sha256}" = "${retired_lifecycle_surface_sha256}"
          test "${pre_retired_lifecycle_surface_sha256}" = "3fe8872c3da9913c28d763f5561d82b67805aae5a6962c6dc403c7d6305da00c"
          test "$(jq -r '.typed_evidence_contract_sha256' "${pre_evidence}")" = "${pre_typed_evidence_contract_sha256}"
          test "${pre_typed_evidence_contract_sha256}" = "${typed_evidence_contract_sha256}"

          pre_topology="$(jq -cS '{hub, cells: (.cells | sort_by(.cell_id))}' "${pre_manifest}")"
          post_topology="$(jq -cS '{hub, cells: (.cells | sort_by(.cell_id))}' "${manifest}")"
          test "${pre_topology}" = "${post_topology}"
          pre_protected="$(jq -cS '{connector_modules: {frp: .connector_modules.frp}, repositories: {frp: .repositories.frp, qurl_reverse_tunnel_server: .repositories.qurl_reverse_tunnel_server}, images: {qurl_reverse_tunnel_server: .images.qurl_reverse_tunnel_server}}' "${pre_manifest}")"
          post_protected="$(jq -cS '{connector_modules: {frp: .connector_modules.frp}, repositories: {frp: .repositories.frp, qurl_reverse_tunnel_server: .repositories.qurl_reverse_tunnel_server}, images: {qurl_reverse_tunnel_server: .images.qurl_reverse_tunnel_server}}' "${manifest}")"
          test "${pre_protected}" = "${post_protected}"
          pre_retirement_cut="$(jq -cS '{connector_modules: {qurl_go: .connector_modules.qurl_go}, repositories: {nhp: .repositories.nhp, qurl_connector: .repositories.qurl_connector, qurl_go: .repositories.qurl_go, qurl_integrations: .repositories.qurl_integrations, qurl_mcp: .repositories.qurl_mcp, qurl_python: .repositories.qurl_python, qurl_service: .repositories.qurl_service, qurl_typescript: .repositories.qurl_typescript, website: .repositories.website}, images: {nhp_cell0: .images.nhp_cell0, nhp_cell1: .images.nhp_cell1, nhp_hub: .images.nhp_hub, qurl_connector: .images.qurl_connector, qurl_service_authority: .images.qurl_service_authority, qurl_service_cell0: .images.qurl_service_cell0, qurl_service_cell1: .images.qurl_service_cell1}}' "${pre_manifest}")"
          post_retirement_cut="$(jq -cS '{connector_modules: {qurl_go: .connector_modules.qurl_go}, repositories: {nhp: .repositories.nhp, qurl_connector: .repositories.qurl_connector, qurl_go: .repositories.qurl_go, qurl_integrations: .repositories.qurl_integrations, qurl_mcp: .repositories.qurl_mcp, qurl_python: .repositories.qurl_python, qurl_service: .repositories.qurl_service, qurl_typescript: .repositories.qurl_typescript, website: .repositories.website}, images: {nhp_cell0: .images.nhp_cell0, nhp_cell1: .images.nhp_cell1, nhp_hub: .images.nhp_hub, qurl_connector: .images.qurl_connector, qurl_service_authority: .images.qurl_service_authority, qurl_service_cell0: .images.qurl_service_cell0, qurl_service_cell1: .images.qurl_service_cell1}}' "${manifest}")"
          test "${pre_retirement_cut}" != "${post_retirement_cut}"

          {
            echo "QURL_GO_SANDBOX_PRE_REMOVAL_EVIDENCE_PATH=${pre_evidence}"
            echo "QURL_GO_SANDBOX_PRE_REMOVAL_EVIDENCE_SHA256=$(sha256sum "${pre_evidence}" | cut -d' ' -f1)"
            echo "QURL_GO_SANDBOX_PRE_REMOVAL_DEPLOYMENT_SHA256=${pre_deployment_sha256}"
          } >> "${GITHUB_ENV}"

      - name: Download authenticated deployment-producer evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ inputs.deployment_artifact_id }}
          repository: layervai/nhp
          run-id: ${{ inputs.deployment_producer_run_id }}
          github-token: ${{ steps.proof-token.outputs.token }}
          path: ${{ runner.temp }}/deployment-producer-artifact
          merge-multiple: true
          digest-mismatch: error

      - name: Materialize authenticated orchestrator evidence
        shell: bash
        run: |
          set -euo pipefail
          producer_dir="${RUNNER_TEMP}/deployment-producer-artifact"
          orchestrator_evidence="${producer_dir}/orchestrator-evidence.json"
          python3 - "${producer_dir}" <<'PY'
          import os
          import stat
          import sys

          root = sys.argv[1]
          expected = {
              "deployment-manifest.json",
              "deployment-provenance.json",
              "deployment-runtime-inputs.json",
              "orchestrator-evidence.json",
          }
          entries = {entry.name: entry for entry in os.scandir(root)}
          if set(entries) != expected:
              raise SystemExit(
                  f"deployment producer artifact file set drift: "
                  f"got {sorted(entries)}, want {sorted(expected)}"
              )
          for name, entry in entries.items():
              mode = entry.stat(follow_symlinks=False).st_mode
              if entry.is_symlink() or not stat.S_ISREG(mode):
                  raise SystemExit(f"deployment producer artifact entry is not a regular file: {name}")
          size = entries["orchestrator-evidence.json"].stat(follow_symlinks=False).st_size
          if size < 1 or size > 64 * 1024:
              raise SystemExit(f"orchestrator evidence size {size} is outside 1..65536 bytes")
          PY
          cmp -- "${producer_dir}/deployment-manifest.json" "${RUNNER_TEMP}/sandbox-deployment-manifest.json"
          cmp -- "${producer_dir}/deployment-runtime-inputs.json" "${RUNNER_TEMP}/deployment-runtime-inputs.json"
          chmod 0444 "${orchestrator_evidence}"
          {
            echo "QURL_GO_SANDBOX_DEPLOYMENT_PROVENANCE_SHA256=$(sha256sum "${producer_dir}/deployment-provenance.json" | cut -d' ' -f1)"
            echo "QURL_GO_SANDBOX_ORCHESTRATOR_EVIDENCE_PATH=${orchestrator_evidence}"
            echo "QURL_GO_SANDBOX_ORCHESTRATOR_EVIDENCE_SHA256=$(sha256sum "${orchestrator_evidence}" | cut -d' ' -f1)"
          } >> "${GITHUB_ENV}"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Validate exact retirement inventory
        run: go test -count=1 ./tests/e2e/nativeudp -run '^(TestPreRetirementScenarioInventory|TestRetiredLifecycleSurfaceContract)$'

      - name: Run strict direct UDP proof
        id: strict
        shell: bash
        env:
          QURL_GO_SANDBOX_STATE_PATH: ${{ runner.temp }}/qurl-go-native-udp/agent-state.json
          QURL_GO_SANDBOX_PROVENANCE_PATH: ${{ runner.temp }}/qurl-go-native-udp/provenance.json
          QURL_GO_SANDBOX_TYPED_EVIDENCE_PATH: ${{ runner.temp }}/native-udp-sandbox.typed-observations.jsonl
          QURL_GO_SANDBOX_RUNTIME_PROBE_PATH: ${{ runner.temp }}/runtime-probe-observations.json
          QURL_GO_SANDBOX_RECOVERY_REQUEST_PATH: ${{ runner.temp }}/qurl-go-native-udp-recovery/request.json
          QURL_GO_SANDBOX_RECOVERY_RESPONSE_PATH: ${{ runner.temp }}/qurl-go-native-udp-recovery/response.json
        run: |
          set -euo pipefail
          umask 077
          credential_file="${RUNNER_TEMP}/proof-account-credential"
          delete_error="${RUNNER_TEMP}/proof-account-secret-delete.err"
          credential=""
          cleanup_credential() {
            credential=""
            rm -f -- "${credential_file}" "${delete_error}"
            unset QURL_GO_SANDBOX_ENROLLMENT_CREDENTIAL
          }
          trap cleanup_credential EXIT
          install -m 0600 /dev/null "${credential_file}"
          aws secretsmanager get-secret-value \
            --secret-id "${PROOF_ACCOUNT_RUN_SECRET}" \
            --query SecretString \
            --output text \
            --region "${QURL_GO_SANDBOX_OTP_MAILBOX_REGION}" >"${credential_file}"
          credential="$(<"${credential_file}")"
          rm -f -- "${credential_file}"
          [[ "${credential}" =~ ^lv_test_[A-Za-z0-9_-]{43}$ ]] || {
            echo "::error::run-bound proof account credential has the wrong wire format"
            exit 1
          }
          echo "::add-mask::${credential}"

          deleted=false
          for _ in 1 2 3; do
            if aws secretsmanager delete-secret \
              --secret-id "${PROOF_ACCOUNT_RUN_SECRET}" \
              --force-delete-without-recovery \
              --region "${QURL_GO_SANDBOX_OTP_MAILBOX_REGION}" \
              >/dev/null 2>"${delete_error}"; then
              deleted=true
              break
            fi
            if grep -q 'ResourceNotFoundException' "${delete_error}"; then
              deleted=true
              break
            fi
          done
          if [[ "${deleted}" != true ]]; then
            echo "::error::could not delete the exact run-bound proof account credential"
            exit 1
          fi
          rm -f -- "${delete_error}"
          export QURL_GO_SANDBOX_ENROLLMENT_CREDENTIAL="${credential}"

          raw="${RUNNER_TEMP}/native-udp-sandbox.raw.json"
          adapter="tests/e2e/nativeudp/kms_sealed_adapter_aws_generated_test.go"
          cp tests/e2e/nativeudp/kms_sealed_adapter_aws_test.go.tmpl "${adapter}"
          recovery_directory="$(dirname "${QURL_GO_SANDBOX_RECOVERY_REQUEST_PATH}")"
          install -d -m 0700 "${recovery_directory}"
          recovery_exchange() {
            local temporary_response
            temporary_response="${QURL_GO_SANDBOX_RECOVERY_RESPONSE_PATH}.tmp"
            trap 'rm -f "${temporary_response}"' RETURN
            for _ in $(seq 1 2400); do
              [[ -s "${QURL_GO_SANDBOX_RECOVERY_REQUEST_PATH}" ]] && break
              sleep 0.25
            done
            [[ -s "${QURL_GO_SANDBOX_RECOVERY_REQUEST_PATH}" ]] || return 1
            aws secretsmanager create-secret \
              --name "${QURL_GO_SANDBOX_RECOVERY_REQUEST_SECRET}" \
              --kms-key-id "${QURL_GO_SANDBOX_RECOVERY_KMS_KEY_ARN}" \
              --secret-string "file://${QURL_GO_SANDBOX_RECOVERY_REQUEST_PATH}" \
              --tags \
                Key=Environment,Value=sandbox \
                Key=Purpose,Value=udp-proof-recovery-request \
                Key=GitHubRunId,Value="${QURL_GO_SANDBOX_NHP_CONTROLLER_RUN_ID}" \
                Key=GitHubRunAttempt,Value="${QURL_GO_SANDBOX_NHP_CONTROLLER_RUN_ATTEMPT}" \
              --region "${AWS_REGION}" >/dev/null
            rm -f "${QURL_GO_SANDBOX_RECOVERY_REQUEST_PATH}"
            for _ in $(seq 1 2400); do
              if aws secretsmanager get-secret-value \
                --secret-id "${QURL_GO_SANDBOX_RECOVERY_RESPONSE_SECRET}" \
                --query SecretString --output text \
                --region "${AWS_REGION}" >"${temporary_response}" 2>/dev/null; then
                chmod 0600 "${temporary_response}"
                mv "${temporary_response}" "${QURL_GO_SANDBOX_RECOVERY_RESPONSE_PATH}"
                aws secretsmanager delete-secret \
                  --secret-id "${QURL_GO_SANDBOX_RECOVERY_RESPONSE_SECRET}" \
                  --force-delete-without-recovery \
                  --region "${AWS_REGION}" >/dev/null
                aws secretsmanager delete-secret \
                  --secret-id "${QURL_GO_SANDBOX_RECOVERY_REQUEST_SECRET}" \
                  --force-delete-without-recovery \
                  --region "${AWS_REGION}" >/dev/null 2>&1 || true
                return 0
              fi
              sleep 0.25
            done
            return 1
          }
          capture_dir="${RUNNER_TEMP}/qurl-go-transport-capture"
          capture_path="${capture_dir}/metadata.txt"
          capture_pid_path="${capture_dir}/tcpdump.pid"
          capture_done_path="${capture_dir}/tcpdump.done"
          capture_error_path="${capture_dir}/tcpdump.stderr"
          capture_targets_path="${capture_dir}/targets.json"
          capture_wrapper_pid=""
          recovery_pid=""
          cleanup_capture() {
            local capture_pid
            if [[ -s "${capture_pid_path}" ]]; then
              capture_pid="$(<"${capture_pid_path}")"
              if [[ "${capture_pid}" =~ ^[1-9][0-9]*$ ]] && kill -0 "${capture_pid}" 2>/dev/null; then
                kill -INT "${capture_pid}" 2>/dev/null || true
              fi
            fi
            if [[ -n "${capture_wrapper_pid}" ]]; then
              wait "${capture_wrapper_pid}" 2>/dev/null || true
            fi
            rm -rf "${capture_dir}"
            rm -f "${adapter}"
          }
          cleanup_proof() {
            if [[ -n "${recovery_pid}" ]]; then
              kill "${recovery_pid}" >/dev/null 2>&1 || true
            fi
            cleanup_capture
            cleanup_credential
            rm -f \
              "${QURL_GO_SANDBOX_RECOVERY_REQUEST_PATH}" \
              "${QURL_GO_SANDBOX_RECOVERY_RESPONSE_PATH}" \
              "${QURL_GO_SANDBOX_RECOVERY_RESPONSE_PATH}.tmp" \
              "${RUNNER_TEMP}/recovery-exchange.log"
          }
          trap cleanup_proof EXIT
          cp tests/e2e/nativeudp/kms_sealed_adapter_aws_test.go.tmpl "${adapter}"
          install -d -m 0700 "${capture_dir}"

          python3 - "${QURL_GO_SANDBOX_DEPLOYMENT_RUNTIME_INPUTS_PATH}" "${capture_targets_path}" <<'PY'
          import json
          import os
          import socket
          import sys

          source, destination = sys.argv[1:]
          with open(source, "r", encoding="utf-8") as stream:
              runtime = json.load(stream)
          hosts = {
              runtime["hub"]["host"],
              *(cell["host"] for cell in runtime["cells"]),
              "api.layerv.xyz",
              "bootstrap.layerv.xyz",
              "relay.qurl.link.layerv.xyz",
          }
          entries = []
          for host in sorted(hosts):
              addresses = sorted({
                  item[4][0]
                  for item in socket.getaddrinfo(
                      host, None, family=socket.AF_INET, type=socket.SOCK_DGRAM
                  )
              })
              if not addresses:
                  raise SystemExit(f"no IPv4 capture target resolved for {host}")
              entries.append({"host": host, "addresses": addresses})
          raw = json.dumps(
              {"version": 1, "hosts": entries},
              allow_nan=False,
              ensure_ascii=True,
              separators=(",", ":"),
          ).encode("ascii")
          descriptor = os.open(destination, os.O_CREAT | os.O_EXCL | os.O_WRONLY, 0o600)
          with os.fdopen(descriptor, "wb") as stream:
              stream.write(raw)
          PY
          capture_targets_b64="$(base64 -w0 "${capture_targets_path}")"
          mapfile -t capture_addresses < <(jq -r '.hosts[].addresses[]' "${capture_targets_path}")
          (( ${#capture_addresses[@]} >= 6 )) || {
            echo "::error::transport capture did not resolve every lifecycle target"
            exit 1
          }
          capture_filter=""
          for address in "${capture_addresses[@]}"; do
            [[ "${address}" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] || {
              echo "::error::transport capture target is not canonical IPv4"
              exit 1
            }
            if [[ -n "${capture_filter}" ]]; then
              capture_filter+=" or "
            fi
            capture_filter+="host ${address}"
          done
          capture_started_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          (
            set +e
            tcpdump -i any -n -l -tt -q "${capture_filter}" \
              >"${capture_path}" 2>"${capture_error_path}" &
            capture_pid=$!
            printf '%s\n' "${capture_pid}" >"${capture_pid_path}"
            chmod 0600 "${capture_pid_path}"
            wait "${capture_pid}"
            capture_status=$?
            if (( capture_status == 0 )); then
              printf 'ok\n' >"${capture_done_path}"
            else
              printf 'failed\n' >"${capture_done_path}"
            fi
            chmod 0600 "${capture_done_path}"
          ) &
          capture_wrapper_pid=$!
          for _ in $(seq 1 50); do
            [[ -s "${capture_pid_path}" ]] && break
            sleep 0.1
          done
          [[ -s "${capture_pid_path}" ]] || {
            echo "::error::transport metadata capture did not start"
            exit 1
          }
          capture_pid="$(<"${capture_pid_path}")"
          if [[ ! "${capture_pid}" =~ ^[1-9][0-9]*$ ]] || ! kill -0 "${capture_pid}"; then
            echo "::error::transport metadata capture exited before the lifecycle"
            sed -n '1,20p' "${capture_error_path}" >&2 || true
            exit 1
          fi
          export QURL_GO_SANDBOX_TRANSPORT_CAPTURE_PATH="${capture_path}"
          export QURL_GO_SANDBOX_TRANSPORT_CAPTURE_PID_PATH="${capture_pid_path}"
          export QURL_GO_SANDBOX_TRANSPORT_CAPTURE_DONE_PATH="${capture_done_path}"
          export QURL_GO_SANDBOX_TRANSPORT_CAPTURE_STARTED_AT="${capture_started_at}"
          export QURL_GO_SANDBOX_TRANSPORT_CAPTURE_TARGETS_B64="${capture_targets_b64}"

          : > "${raw}"
          recovery_exchange >"${RUNNER_TEMP}/recovery-exchange.log" 2>&1 &
          recovery_pid=$!
          if ! go test -tags=qurl_sandbox_kms -count=1 -timeout=60m -json ./tests/e2e/nativeudp \
            -run '^(TestSandboxNativeUDPLifecycle|TestSandboxWireEvidence|TestSandboxTopology)$' \
            > "${raw}"; then
            echo "::error::strict UDP proof failed; raw output withheld because it may contain credentials"
            exit 1
          fi
          if ! wait "${recovery_pid}"; then
            echo "::error::private recovery controller exchange failed; output withheld because it may contain credentials"
            exit 1
          fi

      - name: Enforce qurl-go scenario evidence
        id: enforce
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          compute_proof_harness_sha256() {
            local proof_file
            local -a proof_files
            mapfile -d '' -t proof_files < <(
              {
                printf '%s\0' \
                  .github/workflows/native-udp-sandbox.yml \
                  internal/workflowcontract/native_udp_sandbox_workflow_test.go \
                  tests/e2e/nativeudp/kms_sealed_adapter_aws_test.go.tmpl
                find tests/e2e/nativeudp -type f \( -name '*.go' -o -name '*.json' -o -name '*.py' \) -print0
              } | sort -z -u
            )
            {
              printf 'qurl-go-native-udp-proof-harness-v1\n'
              for proof_file in "${proof_files[@]}"; do
                printf '%s  %s\n' "$(sha256sum "${proof_file}" | cut -d' ' -f1)" "${proof_file}"
              done
            } | sha256sum | cut -d' ' -f1
          }
          artifact="${RUNNER_TEMP}/native-udp-sandbox.raw.json"
          inventory_source="tests/e2e/nativeudp/pre_retirement_scenarios.json"
          inventory="${QURL_GO_SANDBOX_INVENTORY_PATH}"
          retired_surface_source="tests/e2e/nativeudp/retired_lifecycle_surface.json"
          retired_surface="${QURL_GO_SANDBOX_RETIRED_LIFECYCLE_SURFACE_PATH}"
          test -s "${artifact}"
          test -s "${inventory}"
          test -s "${retired_surface}"
          test "$(jq -cS -j '.' "${inventory_source}" | sha256sum | cut -d' ' -f1)" = "${QURL_GO_SANDBOX_INVENTORY_SHA256}"
          test "$(sha256sum "${inventory}" | cut -d' ' -f1)" = "${QURL_GO_SANDBOX_INVENTORY_SHA256}"
          test "$(sha256sum "${QURL_GO_SANDBOX_DEPLOYMENT_MANIFEST_PATH}" | cut -d' ' -f1)" = "${QURL_GO_SANDBOX_DEPLOYMENT_MANIFEST_SHA256}"
          test "$(compute_proof_harness_sha256)" = "${QURL_GO_SANDBOX_PROOF_HARNESS_SHA256}"
          test "$(jq -cS -j '{schema_version, gate, proof_phases, all_scenarios_required, scenarios: ([.scenarios[] | {id, owner, status, test_name, requirement}] | sort_by(.id))}' "${inventory}" | sha256sum | cut -d' ' -f1)" = "${QURL_GO_SANDBOX_INVENTORY_MAPPING_SHA256}"
          test "${QURL_GO_SANDBOX_INVENTORY_MAPPING_SHA256}" = "869e3a4f6cd6fbbb1fb786b9dc26a2778406dcd814bf226cdddc13f66f4b1e2d"
          test "$(jq -cS '{schema_version, gate, proof_phases, all_scenarios_required, scenarios: ([.scenarios[] | {id, owner, test_name, requirement}] | sort_by(.id))}' "${inventory}" | sha256sum | cut -d' ' -f1)" = "${QURL_GO_SANDBOX_SCENARIO_CONTRACT_SHA256}"
          test "$(jq -cS -j . "${retired_surface_source}" | sha256sum | cut -d' ' -f1)" = "${QURL_GO_SANDBOX_RETIRED_LIFECYCLE_SURFACE_SHA256}"
          test "$(sha256sum "${retired_surface}" | cut -d' ' -f1)" = "${QURL_GO_SANDBOX_RETIRED_LIFECYCLE_SURFACE_SHA256}"
          test "${QURL_GO_SANDBOX_RETIRED_LIFECYCLE_SURFACE_SHA256}" = "3fe8872c3da9913c28d763f5561d82b67805aae5a6962c6dc403c7d6305da00c"
          test "$(jq -r '.all_scenarios_required' "${inventory}")" = "true"
          while IFS=$'\t' read -r scenario_id test_name; do
            passes="$(jq -s --arg test_name "${test_name}" '[.[] | select(.Action == "pass" and .Test == $test_name)] | length' "${artifact}")"
            if [[ "${passes}" != "1" ]]; then
              echo "::error title=Missing sandbox evidence::${scenario_id} (${test_name}) emitted ${passes} passing events; require exactly one"
              exit 1
            fi
            skips="$(jq -s --arg test_name "${test_name}" '[.[] | select(.Action == "skip" and (.Test == $test_name or (.Test | startswith($test_name + "/"))))] | length' "${artifact}")"
            if [[ "${skips}" != "0" ]]; then
              echo "::error title=Skipped sandbox evidence::${scenario_id} (${test_name}) emitted ${skips} skip events"
              exit 1
            fi
          done < <(jq -r '.scenarios[] | select(.status == "implemented") | [.id, .test_name] | @tsv' "${inventory}")
          failures="$(jq -s '[.[] | select(.Action == "fail")] | length' "${artifact}")"
          test "${failures}" = "0"
          outstanding="$(jq '[.scenarios[] | select(.owner == "qurl-go" and .status != "implemented")] | length' "${inventory}")"
          if [[ "${outstanding}" != "0" ]]; then
            jq -r '.scenarios[] | select(.owner == "qurl-go" and .status != "implemented") | "::error title=qurl-go scenario pending::\(.id) status=\(.status)"' "${inventory}"
            echo "::error::${outstanding} qurl-go-owned native UDP scenarios remain unproven"
            exit 1
          fi

      - name: Build allowlisted evidence manifest
        if: always()
        env:
          STRICT_OUTCOME: ${{ steps.strict.outcome }}
          ENFORCEMENT_OUTCOME: ${{ steps.enforce.outcome }}
          QURL_GO_SANDBOX_DISPATCH_CORRELATION_ID: ${{ inputs.dispatch_correlation_id }}
          QURL_GO_SANDBOX_NHP_CONTROLLER_RUN_ID: ${{ inputs.nhp_controller_run_id }}
          QURL_GO_SANDBOX_NHP_CONTROLLER_RUN_ATTEMPT: ${{ inputs.nhp_controller_run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          compute_proof_harness_sha256() {
            local proof_file
            local -a proof_files
            mapfile -d '' -t proof_files < <(
              {
                printf '%s\0' \
                  .github/workflows/native-udp-sandbox.yml \
                  internal/workflowcontract/native_udp_sandbox_workflow_test.go \
                  tests/e2e/nativeudp/kms_sealed_adapter_aws_test.go.tmpl
                find tests/e2e/nativeudp -type f \( -name '*.go' -o -name '*.json' -o -name '*.py' \) -print0
              } | sort -z -u
            )
            {
              printf 'qurl-go-native-udp-proof-harness-v1\n'
              for proof_file in "${proof_files[@]}"; do
                printf '%s  %s\n' "$(sha256sum "${proof_file}" | cut -d' ' -f1)" "${proof_file}"
              done
            } | sha256sum | cut -d' ' -f1
          }
          raw="${RUNNER_TEMP}/native-udp-sandbox.raw.json"
          evidence="${RUNNER_TEMP}/native-udp-sandbox.evidence.json"
          inventory_source="tests/e2e/nativeudp/pre_retirement_scenarios.json"
          inventory="${QURL_GO_SANDBOX_INVENTORY_PATH:-${inventory_source}}"
          retired_surface_source="tests/e2e/nativeudp/retired_lifecycle_surface.json"
          retired_surface="${QURL_GO_SANDBOX_RETIRED_LIFECYCLE_SURFACE_PATH:-${retired_surface_source}}"
          deployment="${RUNNER_TEMP}/sandbox-deployment-manifest.json"
          deployment_runtime="${RUNNER_TEMP}/deployment-runtime-inputs.json"
          provenance_path="${RUNNER_TEMP}/qurl-go-native-udp/provenance.json"
          typed_evidence_contract="tests/e2e/nativeudp/typed_evidence_contract.json"
          typed_evidence_contract_snapshot="${RUNNER_TEMP}/typed_evidence_contract.json"
          typed_observations="${RUNNER_TEMP}/native-udp-sandbox.typed-observations.jsonl"
          typed_evidence_summary="${RUNNER_TEMP}/native-udp-sandbox.typed-evidence.json"
          orchestrator_evidence_path="${RUNNER_TEMP}/deployment-producer-artifact/orchestrator-evidence.json"
          trap 'rm -f "${raw}" "${typed_observations}" "${typed_evidence_summary}"' EXIT

          inputs_unchanged=false
          if [[ "${QURL_GO_SANDBOX_NHP_CONTROLLER_RUN_ID}" =~ ^[1-9][0-9]{0,19}$ ]] &&
            [[ "${QURL_GO_SANDBOX_NHP_CONTROLLER_RUN_ATTEMPT}" =~ ^[1-9][0-9]{0,9}$ ]] &&
            [[ "${QURL_GO_SANDBOX_DISPATCH_CORRELATION_ID}" =~ ^nhp-${QURL_GO_SANDBOX_NHP_CONTROLLER_RUN_ID}-${QURL_GO_SANDBOX_NHP_CONTROLLER_RUN_ATTEMPT}-qurl_go-${QURL_GO_SANDBOX_PROOF_PHASE}-[0-9a-f]{32}$ ]] &&
            [[ "${QURL_GO_SANDBOX_DEPLOYMENT_PRODUCER_RUN_ID}" =~ ^[1-9][0-9]{0,19}$ ]] &&
            [[ "${QURL_GO_SANDBOX_DEPLOYMENT_PRODUCER_RUN_ATTEMPT}" =~ ^[1-9][0-9]{0,9}$ ]] &&
            [[ "${QURL_GO_SANDBOX_DEPLOYMENT_PRODUCER_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]] &&
            [[ "${QURL_GO_SANDBOX_DEPLOYMENT_ARTIFACT_ID}" =~ ^[1-9][0-9]{0,19}$ ]] &&
            [[ "${QURL_GO_SANDBOX_DEPLOYMENT_ARTIFACT_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] &&
            [[ "${QURL_GO_SANDBOX_NHP_SOURCE_SHA:-}" =~ ^[0-9a-f]{40}$ ]] &&
            [[ "${QURL_GO_SANDBOX_QURL_SERVICE_SOURCE_SHA:-}" =~ ^[0-9a-f]{40}$ ]] &&
            [[ "${QURL_GO_SANDBOX_QURL_SERVICE_AUTHORITY_IMAGE_DIGEST:-}" =~ ^sha256:[0-9a-f]{64}$ ]] &&
            [[ "${QURL_GO_SANDBOX_DEPLOYMENT_PROVENANCE_SHA256:-}" =~ ^[0-9a-f]{64}$ ]] &&
            [[ -n "${QURL_GO_SANDBOX_INVENTORY_SHA256:-}" && -n "${QURL_GO_SANDBOX_INVENTORY_MAPPING_SHA256:-}" && -n "${QURL_GO_SANDBOX_DEPLOYMENT_MANIFEST_SHA256:-}" && -n "${QURL_GO_SANDBOX_DEPLOYMENT_RUNTIME_INPUTS_SHA256:-}" && -n "${QURL_GO_SANDBOX_PROOF_HARNESS_SHA256:-}" && -n "${QURL_GO_SANDBOX_SCENARIO_CONTRACT_SHA256:-}" && -n "${QURL_GO_SANDBOX_TYPED_EVIDENCE_CONTRACT_SHA256:-}" && -n "${QURL_GO_SANDBOX_RETIRED_LIFECYCLE_SURFACE_SHA256:-}" && -s "${inventory_source}" && -s "${inventory}" && -s "${retired_surface_source}" && -s "${retired_surface}" && -s "${deployment}" && -s "${deployment_runtime}" ]] &&
            [[ "${QURL_GO_SANDBOX_ORCHESTRATOR_EVIDENCE_PATH:-}" == "${orchestrator_evidence_path}" ]] &&
            [[ "${QURL_GO_SANDBOX_ORCHESTRATOR_EVIDENCE_SHA256:-}" =~ ^[0-9a-f]{64}$ ]] &&
            [[ -s "${orchestrator_evidence_path}" ]] &&
            [[ "$(jq -cS -j '.' "${inventory_source}" | sha256sum | cut -d' ' -f1)" == "${QURL_GO_SANDBOX_INVENTORY_SHA256}" ]] &&
            [[ "$(sha256sum "${inventory}" | cut -d' ' -f1)" == "${QURL_GO_SANDBOX_INVENTORY_SHA256}" ]] &&
            [[ "$(sha256sum "${deployment}" | cut -d' ' -f1)" == "${QURL_GO_SANDBOX_DEPLOYMENT_MANIFEST_SHA256}" ]] &&
            [[ "$(sha256sum "${deployment_runtime}" | cut -d' ' -f1)" == "${QURL_GO_SANDBOX_DEPLOYMENT_RUNTIME_INPUTS_SHA256}" ]] &&
            [[ "$(jq -r '.repositories.nhp' "${deployment}")" == "${QURL_GO_SANDBOX_NHP_SOURCE_SHA}" ]] &&
            [[ "$(jq -r '.repositories.qurl_service' "${deployment}")" == "${QURL_GO_SANDBOX_QURL_SERVICE_SOURCE_SHA}" ]] &&
            [[ "$(jq -r '.images.qurl_service_authority' "${deployment}")" == "${QURL_GO_SANDBOX_QURL_SERVICE_AUTHORITY_IMAGE_DIGEST}" ]] &&
            [[ "$(sha256sum "${orchestrator_evidence_path}" | cut -d' ' -f1)" == "${QURL_GO_SANDBOX_ORCHESTRATOR_EVIDENCE_SHA256}" ]] &&
            [[ "$(compute_proof_harness_sha256)" == "${QURL_GO_SANDBOX_PROOF_HARNESS_SHA256}" ]] &&
            [[ "$(jq -cS -j '{schema_version, gate, proof_phases, all_scenarios_required, scenarios: ([.scenarios[] | {id, owner, status, test_name, requirement}] | sort_by(.id))}' "${inventory}" | sha256sum | cut -d' ' -f1)" == "${QURL_GO_SANDBOX_INVENTORY_MAPPING_SHA256}" ]] &&
            [[ "${QURL_GO_SANDBOX_INVENTORY_MAPPING_SHA256}" == "869e3a4f6cd6fbbb1fb786b9dc26a2778406dcd814bf226cdddc13f66f4b1e2d" ]] &&
            [[ "$(jq -cS -j . "${retired_surface_source}" | sha256sum | cut -d' ' -f1)" == "${QURL_GO_SANDBOX_RETIRED_LIFECYCLE_SURFACE_SHA256}" ]] &&
            [[ "$(sha256sum "${retired_surface}" | cut -d' ' -f1)" == "${QURL_GO_SANDBOX_RETIRED_LIFECYCLE_SURFACE_SHA256}" ]] &&
            [[ "${QURL_GO_SANDBOX_RETIRED_LIFECYCLE_SURFACE_SHA256}" == "3fe8872c3da9913c28d763f5561d82b67805aae5a6962c6dc403c7d6305da00c" ]] &&
            [[ "$(sha256sum "${typed_evidence_contract_snapshot}" | cut -d' ' -f1)" == "${QURL_GO_SANDBOX_TYPED_EVIDENCE_CONTRACT_SHA256}" ]] &&
            [[ "${QURL_GO_SANDBOX_TYPED_EVIDENCE_CONTRACT_SHA256}" == "f4b37aceb2dd55f2c1cf6d7ec4e955cfeb69297ff6151b565935d03d01f65d08" ]] &&
            [[ "$(jq -cS '{schema_version, gate, proof_phases, all_scenarios_required, scenarios: ([.scenarios[] | {id, owner, test_name, requirement}] | sort_by(.id))}' "${inventory}" | sha256sum | cut -d' ' -f1)" == "${QURL_GO_SANDBOX_SCENARIO_CONTRACT_SHA256}" ]]; then
            inputs_unchanged=true
          fi

          scenario_results='[]'
          if [[ -s "${raw}" && "${inputs_unchanged}" == "true" ]]; then
            scenario_results="$(jq -s --slurpfile inventory "${inventory}" '
              [.[] as $event
                | select($event.Action == "pass" or $event.Action == "fail" or $event.Action == "skip")
                | select($event.Test as $test | $inventory[0].scenarios |
                    any(.owner == "qurl-go" and .status == "implemented" and .test_name == $test))
                | {test_name: $event.Test, action: $event.Action, elapsed_seconds: ($event.Elapsed // null)}]
            ' "${raw}")"
          fi

          typed_inventory="${inventory}"
          if [[ "${inputs_unchanged}" != "true" ]]; then
            typed_inventory="${inventory_source}"
          fi
          python3 tests/e2e/nativeudp/verify_typed_evidence.py \
            --inventory "${typed_inventory}" \
            --contract "${typed_evidence_contract}" \
            --observations "${typed_observations}" \
            --output "${typed_evidence_summary}" \
            --allow-incomplete
          verifier_aggregate_complete="$(jq -er '
            .aggregate_complete |
            if type == "boolean" then tostring
            else error("aggregate_complete must be boolean")
            end
          ' "${typed_evidence_summary}")"
          typed_evidence_complete="$(jq -r \
            --slurpfile inventory "${typed_inventory}" \
            --slurpfile contract "${typed_evidence_contract}" '
            def static_nhp:
              . == "orchestrator.real_hub_authority_and_two_cells" or
              . == "retirement.generated_artifact_parity" or
              . == "retirement.nhp_registrar_surface_state" or
              . == "retirement.terraform_saved_plan_and_live_state";
            .scenarios as $observed |
            all($inventory[0].scenarios[];
              .id as $id |
              ([$observed[] | select(.scenario_key == $id) | .evidence[].kind] | sort) ==
                (if .owner == "qurl-go" or ($id | static_nhp)
                 then ($contract[0].scenarios[$id] | sort)
                 else []
                 end))
          ' "${typed_evidence_summary}")"
          test "${typed_evidence_complete}" = "${verifier_aggregate_complete}"
          typed_evidence="$(jq -c '.scenarios' "${typed_evidence_summary}")"

          producer_owned_count=0
          external_dependency_count=1
          if [[ "${inputs_unchanged}" == "true" ]]; then
            producer_owned_count="$(jq '[.scenarios[] | select(.owner == "qurl-go" and .status == "implemented")] | length' "${inventory}")"
            external_dependency_count="$(jq '[.scenarios[] | select(.owner != "qurl-go" and .status == "external_dependency")] | length' "${inventory}")"
          fi
          failure_count=0
          skip_count=0
          exact_pass_count=0
          if [[ -s "${raw}" && "${inputs_unchanged}" == "true" ]]; then
            failure_count="$(jq -s '[.[] | select(.Action == "fail")] | length' "${raw}")"
            skip_count="$(jq -s --slurpfile inventory "${inventory}" '[.[] as $event | select($event.Action == "skip") | select($event.Test as $test | $inventory[0].scenarios | any(.status == "implemented" and (.test_name as $root | ($test == $root or ($test | startswith($root + "/"))))))] | length' "${raw}")"
            while IFS= read -r test_name; do
              passes="$(jq -s --arg test_name "${test_name}" '[.[] | select(.Action == "pass" and .Test == $test_name)] | length' "${raw}")"
              if [[ "${passes}" == "1" ]]; then
                exact_pass_count="$((exact_pass_count + 1))"
              fi
            done < <(jq -r '.scenarios[] | select(.status == "implemented") | .test_name' "${inventory}")
          fi

          provenance_valid=false
          two_cell_provenance=false
          provenance='null'
          if [[ "${inputs_unchanged}" == "true" && -s "${provenance_path}" ]] && jq -e \
            --slurpfile deployment "${deployment}" \
            --arg build_sha "${GITHUB_SHA}" \
            --arg agent_id "${QURL_GO_SANDBOX_AGENT_ID}" \
            --arg deployment_manifest_sha256 "${QURL_GO_SANDBOX_DEPLOYMENT_MANIFEST_SHA256}" \
            --arg typed_evidence_contract_sha256 "${QURL_GO_SANDBOX_TYPED_EVIDENCE_CONTRACT_SHA256}" '
            def valid_counter:
              type == "number" and isfinite and . == floor and . >= 1 and . <= 9007199254740991;
            def same_assignment_binding($left; $right):
              $left.cell_id == $right.cell_id and $left.host == $right.host and $left.port == $right.port and
              $left.server_public_key_sha256 == $right.server_public_key_sha256 and
              $left.assignment_generation == $right.assignment_generation and
              $left.endpoint_revision == $right.endpoint_revision and $left.lease_expires_at == $right.lease_expires_at;
            def valid_same_cell_refresh($left; $right):
              def rfc3339_parts:
                capture("^(?<base>[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2})(?:\\.(?<fraction>[0-9]{1,9}))?Z$") as $timestamp |
                ($timestamp.base + "Z") as $whole_seconds |
                ($whole_seconds | fromdateiso8601) as $epoch_seconds |
                select(($epoch_seconds | strftime("%Y-%m-%dT%H:%M:%SZ")) == $whole_seconds) |
                [$epoch_seconds,
                 (((($timestamp.fraction // "") + "000000000")[0:9]) | tonumber)];
              ($left.lease_expires_at | rfc3339_parts) as $left_lease |
              ($right.lease_expires_at | rfc3339_parts) as $right_lease |
              $left.cell_id == $right.cell_id and $left.host == $right.host and $left.port == $right.port and
              $left.server_public_key_sha256 == $right.server_public_key_sha256 and
              $left.assignment_generation == $right.assignment_generation and
              $right.endpoint_revision >= $left.endpoint_revision and
              ($right_lease[0] > $left_lease[0] or
               ($right_lease[0] == $left_lease[0] and $right_lease[1] >= $left_lease[1]));
            . as $proof | $deployment[0] as $deployed |
            type == "object" and
            (keys | sort) == ["agent_id", "assigned_cells", "build_sha", "deployment_manifest_sha256", "hub", "schema_version", "typed_evidence_contract_sha256"] and
            .schema_version == 2 and .build_sha == $build_sha and .agent_id == $agent_id and
            .deployment_manifest_sha256 == $deployment_manifest_sha256 and
            .typed_evidence_contract_sha256 == $typed_evidence_contract_sha256 and
            (.deployment_manifest_sha256 | test("^[0-9a-f]{64}$")) and
            (.typed_evidence_contract_sha256 | test("^[0-9a-f]{64}$")) and
            (.hub | type == "object" and (keys | sort) == ["host", "port", "server_public_key_sha256"] and . == $deployed.hub) and
            (.assigned_cells | type == "array" and length == 4 and
              [.[].phase] == ["registration", "warm_open", "reassignment", "refresh"] and
              ([.[].cell_id] | unique | length) >= 2 and
              ([.[].host] | unique | length) >= 2 and
              ([.[].server_public_key_sha256] | unique | length) >= 2 and
              same_assignment_binding(.[0]; .[1]) and
              .[1].cell_id == "cell0" and .[2].cell_id == "cell1" and
              .[2].assignment_generation > .[1].assignment_generation and
              valid_same_cell_refresh(.[2]; .[3]) and
              all(.[];
                type == "object" and
                (keys | sort) == ["assignment_generation", "cell_id", "endpoint_revision", "host", "lease_expires_at", "phase", "port", "server_public_key_sha256"] and
                (.phase | test("^[a-z](?:[a-z0-9_]{0,62}[a-z0-9])?$")) and
                (.assignment_generation | valid_counter) and (.endpoint_revision | valid_counter) and
                (.lease_expires_at | type == "string" and length >= 20 and length <= 30 and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\\.[0-9]{1,9})?Z$")) and
                (. as $observed | any($deployed.cells[];
                  .cell_id == $observed.cell_id and .host == $observed.host and .port == $observed.port and
                  .server_public_key_sha256 == $observed.server_public_key_sha256))))
          ' "${provenance_path}" >/dev/null; then
            provenance_valid=true
            two_cell_provenance=true
            provenance="$(jq -c . "${provenance_path}")"
          fi

          gate_passed=false
          if [[ "${STRICT_OUTCOME}" == "success" && "${ENFORCEMENT_OUTCOME}" == "success" && "${inputs_unchanged}" == "true" && "${failure_count}" == "0" && "${skip_count}" == "0" && "${exact_pass_count}" == "${producer_owned_count}" && "${provenance_valid}" == "true" && "${two_cell_provenance}" == "true" && "${typed_evidence_complete}" == "true" ]]; then
            gate_passed=true
          fi

          jq -cS -j -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg commit_sha "${GITHUB_SHA}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg dispatch_correlation_id "${QURL_GO_SANDBOX_DISPATCH_CORRELATION_ID}" \
            --arg nhp_controller_run_id "${QURL_GO_SANDBOX_NHP_CONTROLLER_RUN_ID}" \
            --arg nhp_controller_run_attempt "${QURL_GO_SANDBOX_NHP_CONTROLLER_RUN_ATTEMPT}" \
            --arg phase "${QURL_GO_SANDBOX_PROOF_PHASE}" \
            --arg deployment_producer_run_id "${QURL_GO_SANDBOX_DEPLOYMENT_PRODUCER_RUN_ID}" \
            --arg deployment_producer_run_attempt "${QURL_GO_SANDBOX_DEPLOYMENT_PRODUCER_RUN_ATTEMPT}" \
            --arg deployment_producer_head_sha "${QURL_GO_SANDBOX_DEPLOYMENT_PRODUCER_HEAD_SHA}" \
            --arg deployment_artifact_id "${QURL_GO_SANDBOX_DEPLOYMENT_ARTIFACT_ID}" \
            --arg deployment_artifact_digest "${QURL_GO_SANDBOX_DEPLOYMENT_ARTIFACT_DIGEST}" \
            --arg pre_removal_run_id "${QURL_GO_SANDBOX_PRE_REMOVAL_RUN_ID}" \
            --arg pre_removal_evidence_sha256 "${QURL_GO_SANDBOX_PRE_REMOVAL_EVIDENCE_SHA256:-}" \
            --arg pre_removal_deployment_sha256 "${QURL_GO_SANDBOX_PRE_REMOVAL_DEPLOYMENT_SHA256:-}" \
            --arg strict_outcome "${STRICT_OUTCOME}" \
            --arg enforcement_outcome "${ENFORCEMENT_OUTCOME}" \
            --arg deployment_manifest_sha256 "${QURL_GO_SANDBOX_DEPLOYMENT_MANIFEST_SHA256:-}" \
            --arg deployment_runtime_inputs_sha256 "${QURL_GO_SANDBOX_DEPLOYMENT_RUNTIME_INPUTS_SHA256:-}" \
            --arg inventory_sha256 "${QURL_GO_SANDBOX_INVENTORY_SHA256:-}" \
            --arg inventory_mapping_sha256 "${QURL_GO_SANDBOX_INVENTORY_MAPPING_SHA256:-}" \
            --arg scenario_contract_sha256 "${QURL_GO_SANDBOX_SCENARIO_CONTRACT_SHA256:-}" \
            --arg retired_lifecycle_surface_sha256 "${QURL_GO_SANDBOX_RETIRED_LIFECYCLE_SURFACE_SHA256:-}" \
            --arg typed_evidence_contract_sha256 "${QURL_GO_SANDBOX_TYPED_EVIDENCE_CONTRACT_SHA256:-}" \
            --arg proof_harness_sha256 "${QURL_GO_SANDBOX_PROOF_HARNESS_SHA256:-}" \
            --argjson producer_owned_count "${producer_owned_count}" \
            --argjson external_dependency_count "${external_dependency_count}" \
            --argjson failure_count "${failure_count}" \
            --argjson skip_count "${skip_count}" \
            --argjson exact_pass_count "${exact_pass_count}" \
            --argjson inputs_unchanged "${inputs_unchanged}" \
            --argjson gate_passed "${gate_passed}" \
            --argjson provenance_valid "${provenance_valid}" \
            --argjson two_cell_provenance "${two_cell_provenance}" \
            --argjson provenance "${provenance}" \
            --argjson typed_evidence_complete "${typed_evidence_complete}" \
            --argjson typed_evidence "${typed_evidence}" \
            --argjson scenario_results "${scenario_results}" \
            '{schema_version: 1, phase: $phase, repository: $repository, commit_sha: $commit_sha, run_id: $run_id, run_attempt: $run_attempt, dispatch_correlation_id: $dispatch_correlation_id, nhp_controller_run_id: $nhp_controller_run_id, nhp_controller_run_attempt: $nhp_controller_run_attempt, deployment_producer: {repository: "layervai/nhp", workflow_path: ".github/workflows/udp-proof-deployment-manifest.yml", run_id: $deployment_producer_run_id, run_attempt: $deployment_producer_run_attempt, head_sha: $deployment_producer_head_sha, artifact_id: $deployment_artifact_id, artifact_digest: $deployment_artifact_digest}, pre_removal_run_id: (if $pre_removal_run_id == "" then null else $pre_removal_run_id end), pre_removal_evidence_sha256: (if $pre_removal_evidence_sha256 == "" then null else $pre_removal_evidence_sha256 end), pre_removal_deployment_sha256: (if $pre_removal_deployment_sha256 == "" then null else $pre_removal_deployment_sha256 end), deployment_manifest_sha256: $deployment_manifest_sha256, deployment_runtime_inputs_sha256: $deployment_runtime_inputs_sha256, inventory_sha256: $inventory_sha256, inventory_mapping_sha256: $inventory_mapping_sha256, scenario_contract_sha256: $scenario_contract_sha256, retired_lifecycle_surface_sha256: $retired_lifecycle_surface_sha256, typed_evidence_contract_sha256: $typed_evidence_contract_sha256, proof_harness_sha256: $proof_harness_sha256, strict_outcome: $strict_outcome, enforcement_outcome: $enforcement_outcome, inputs_unchanged: $inputs_unchanged, gate_passed: $gate_passed, counts: {producer_owned: $producer_owned_count, external_dependency: $external_dependency_count, failures: $failure_count, skips: $skip_count, exact_passes: $exact_pass_count}, provenance_valid: $provenance_valid, two_cell_provenance: $two_cell_provenance, provenance: $provenance, typed_evidence_complete: $typed_evidence_complete, typed_evidence: $typed_evidence, scenario_results: $scenario_results}' \
            > "${evidence}"

      - name: Upload non-secret JSON evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-udp-sandbox-${{ inputs.proof_phase }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-udp-sandbox.evidence.json
            ${{ runner.temp }}/runtime-probe-observations.json
            ${{ runner.temp }}/sandbox-deployment-manifest.json
            ${{ runner.temp }}/deployment-runtime-inputs.json
            ${{ runner.temp }}/pre_retirement_scenarios.json
            ${{ runner.temp }}/retired_lifecycle_surface.json
            ${{ runner.temp }}/typed_evidence_contract.json
          if-no-files-found: error
          retention-days: 30

      - name: Require complete qurl-go proof publication
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/native-udp-sandbox.evidence.json"
          test -s "${RUNNER_TEMP}/runtime-probe-observations.json"
          jq -e \
            --slurpfile inventory "${RUNNER_TEMP}/pre_retirement_scenarios.json" \
            --slurpfile deployment "${RUNNER_TEMP}/sandbox-deployment-manifest.json" '
            . as $evidence | $inventory[0] as $scenarios |
            (keys | sort) == ["commit_sha", "counts", "deployment_manifest_sha256", "deployment_producer", "deployment_runtime_inputs_sha256", "dispatch_correlation_id", "enforcement_outcome", "gate_passed", "inputs_unchanged", "inventory_mapping_sha256", "inventory_sha256", "nhp_controller_run_attempt", "nhp_controller_run_id", "phase", "pre_removal_deployment_sha256", "pre_removal_evidence_sha256", "pre_removal_run_id", "proof_harness_sha256", "provenance", "provenance_valid", "repository", "retired_lifecycle_surface_sha256", "run_attempt", "run_id", "scenario_contract_sha256", "scenario_results", "schema_version", "strict_outcome", "two_cell_provenance", "typed_evidence", "typed_evidence_complete", "typed_evidence_contract_sha256"] and
            .gate_passed == true and
            .strict_outcome == "success" and
            .enforcement_outcome == "success" and
            .inputs_unchanged == true and
            (.nhp_controller_run_id | type == "string" and test("^[1-9][0-9]{0,19}$")) and
            (.nhp_controller_run_attempt | type == "string" and test("^[1-9][0-9]{0,9}$")) and
            (. as $e | $e.dispatch_correlation_id | type == "string" and
              test("^nhp-" + $e.nhp_controller_run_id + "-" + $e.nhp_controller_run_attempt + "-qurl_go-" + $e.phase + "-[0-9a-f]{32}$")) and
            (.deployment_producer |
              (keys | sort) == ["artifact_digest", "artifact_id", "head_sha", "repository", "run_attempt", "run_id", "workflow_path"] and
              .repository == "layervai/nhp" and
              .workflow_path == ".github/workflows/udp-proof-deployment-manifest.yml" and
              (.run_id | test("^[1-9][0-9]{0,19}$")) and
              (.run_attempt | test("^[1-9][0-9]{0,9}$")) and
              (.head_sha | test("^[0-9a-f]{40}$")) and
              (.artifact_id | test("^[1-9][0-9]{0,19}$")) and
              (.artifact_digest | test("^sha256:[0-9a-f]{64}$"))) and
            (.deployment_runtime_inputs_sha256 | test("^[0-9a-f]{64}$")) and
            ($scenarios.scenarios | length == 68 and
              all(.[]; if .owner == "qurl-go" then .status == "implemented" else .status == "external_dependency" end)) and
            (.counts | type == "object" and
              (keys | sort) == ["exact_passes", "external_dependency", "failures", "producer_owned", "skips"]) and
            .counts.producer_owned == ([$scenarios.scenarios[] | select(.owner == "qurl-go" and .status == "implemented")] | length) and
            .counts.external_dependency == ([$scenarios.scenarios[] | select(.owner != "qurl-go" and .status == "external_dependency")] | length) and
            .counts.failures == 0 and .counts.skips == 0 and
            .counts.exact_passes == .counts.producer_owned and
            .provenance_valid == true and .two_cell_provenance == true and
            .typed_evidence_complete == true and
            (.scenario_results | type == "array" and
              length == $evidence.counts.producer_owned and
              ([.[].test_name] | unique | length) == length and
              all(.[];
                type == "object" and
                (keys | sort) == ["action", "elapsed_seconds", "test_name"] and
                .action == "pass" and
                (.elapsed_seconds == null or
                  (.elapsed_seconds | type == "number" and isfinite and . >= 0)) and
                (. as $result | any($scenarios.scenarios[];
                  .owner == "qurl-go" and .status == "implemented" and
                  .test_name == $result.test_name)))) and
            .typed_evidence_contract_sha256 == "f4b37aceb2dd55f2c1cf6d7ec4e955cfeb69297ff6151b565935d03d01f65d08" and
            (.typed_evidence | type == "array" and length == ($scenarios.scenarios | length) and
              ([.[].scenario_key] | sort) == ($scenarios.scenarios | map(.id) | sort) and
              all(.[];
                (keys | sort) == ["evidence", "scenario_key"] and
                (.scenario_key | type == "string") and
                (. as $typed |
                  ($scenarios.scenarios[] | select(.id == $typed.scenario_key)) as $scenario |
                  (.evidence | type == "array") and
                  (if $scenario.owner == "qurl-go" or
                      ($scenario.id == "orchestrator.real_hub_authority_and_two_cells" or
                       $scenario.id == "retirement.generated_artifact_parity" or
                       $scenario.id == "retirement.nhp_registrar_surface_state" or
                       $scenario.id == "retirement.terraform_saved_plan_and_live_state") then
                    (.evidence | length >= 1)
                  else
                    (.evidence | length == 0)
                  end) and
                  all(.evidence[];
                    (keys | sort) == ["kind", "observation", "observation_sha256"] and
                    (.kind | type == "string" and test("^[a-z][a-z0-9_]{0,63}$")) and
                    (. as $item |
                      if $scenario.owner == "qurl-go" then
                        $item.observation == {
                          evidence_kind: $item.kind,
                          outcome: "pass",
                          producer: "layervai/qurl-go",
                          scenario_key: $typed.scenario_key,
                          test_name: $scenario.test_name,
                          verified: true
                        }
                      else
                        ($item.observation | type == "object" and
                          (keys | sort) == ["evidence_kind", "producer", "producer_run_id", "row_sha256", "scenario_key", "source_sha", "verified"] and
                          .evidence_kind == $item.kind and
                          .producer == "layervai/nhp" and
                          .scenario_key == $typed.scenario_key and
                          .verified == true and
                          (.producer_run_id | type == "number" and isfinite and . == floor and . >= 1) and
                          (.producer_run_id | tostring) == $evidence.deployment_producer.run_id and
                          (.row_sha256 | type == "string" and test("^[0-9a-f]{64}$")) and
                          .source_sha == $deployment[0].repositories.nhp)
                      end) and
                    (.observation_sha256 | type == "string" and test("^[0-9a-f]{64}$"))))))
          ' "${evidence}" >/dev/null

      - name: Remove credential state
        if: always()
        shell: bash
        run: rm -rf "${RUNNER_TEMP}/qurl-go-native-udp" "${RUNNER_TEMP}/pre-removal-evidence" "${RUNNER_TEMP}/deployment-producer-artifact" "${RUNNER_TEMP}/sandbox-deployment-manifest.input.json" "${RUNNER_TEMP}/sandbox-deployment-manifest.canonical.tmp"
