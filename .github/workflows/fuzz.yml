name: Fuzz (nightly)

# Live fuzzing as a scheduled soak rather than a PR gate: a fuzzer can discover a
# new, possibly unrelated crasher at any time, so blocking PRs on it would red
# good PRs nondeterministically. Deterministic regression coverage lives in the
# committed seed corpus, which the normal `go test` (CI `test` job) always replays.
# A found crasher here surfaces as a failed scheduled run, and the seed corpus it
# writes is uploaded so it can be committed as a permanent regression.

on:
  schedule:
    - cron: "0 7 * * *" # daily at 07:00 UTC
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "Fuzz duration per target (Go duration, e.g. 5m)"
        required: false
        default: "5m"

concurrency:
  group: "fuzz-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz soak
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      # `make fuzz` walks every package in both workspace modules and soaks each
      # discovered FuzzXxx, so a new target anywhere in the repo is picked up
      # without editing this workflow. The dispatch input is passed through an
      # env var rather than interpolated into the run script, to avoid shell
      # injection from the workflow_dispatch field.
      - name: Fuzz soak (all discovered targets)
        env:
          FUZZTIME: ${{ inputs.fuzztime || '5m' }}
        run: make fuzz FUZZTIME="$FUZZTIME"

      # The upload below is repo-wide, so it necessarily carries the committed
      # seed corpus too. Name the untracked entries in the log so the maintainer
      # knows which file in the artifact is the new crasher.
      - name: Name new corpus entries
        if: failure()
        run: git status --porcelain -- '*/testdata/fuzz/*'

      # On a crash, Go writes the offending input under the OWNING package's
      # testdata/fuzz/<target>/ — which is wherever the target lives, not a
      # single known directory. The glob must therefore stay repo-wide, or a
      # crasher found outside internal/qv2 is discovered and then thrown away.
      - name: Upload new crashers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore
